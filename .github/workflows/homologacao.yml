# =====================================================================
# Homologação — copiar a ESTRUTURA da produção, por botão
#
# NÃO roda sozinha. Só quando alguém aperta "Run workflow" e digita a
# confirmação. Não tem gatilho por push, de propósito: a homologação não
# deve seguir a `main` — se seguisse, viraria um segundo ambiente de
# teste, e já existe um.
#
# O QUE ELA FAZ
#   1) lê a estrutura da PRODUÇÃO com um usuário SOMENTE LEITURA;
#   2) confere que não veio nenhuma linha de dado junto;
#   3) apaga e recria o schema public da HOMOLOGAÇÃO com essa estrutura;
#   4) guarda o retrato como anexo da corrida, para conferência.
#
# MODO "so_finalizar": pula a leitura e a cópia (os passos caros, ~35min)
# e roda só o final — senha, identidades e as duas conferências. Existe
# porque retomar "do ponto do erro" de verdade seria carregar meia cópia
# sem prova de inteireza; aqui a retomada é segura pelo caminho inverso:
# aproveita o que estiver no destino E DEIXA AS CONFERÊNCIAS JULGAREM. A
# máscara é determinística (mesmo dado + mesmo tempero = mesmo resultado),
# então dado carregado numa corrida anterior é idêntico ao que uma corrida
# nova carregaria — se as conferências fecharem, o estado vale; se não
# fecharem, a corrida reprova e aí sim se roda o modo completo.
#
# A PRODUÇÃO NUNCA É ALTERADA POR AQUI, e não é promessa de configuração:
# a credencial usada é de um usuário criado com pg_read_all_data e sem
# permissão de escrita (docs/script_homologacao_leitor_producao.sql). Se
# esta esteira tentasse escrever na produção, o banco recusaria.
#
# POR QUE NÃO EXISTE MAIS URL DE CONEXÃO AQUI
# As duas primeiras versões montavam `postgresql://usuario:senha@host/banco`
# — uma pedindo a string pronta, outra montando-a a partir de seis secrets,
# com codificação de URL. As duas falharam pelo mesmo motivo: quem lê uma
# URL procura o primeiro `@` para saber onde a senha termina, e a senha da
# produção tem um `@`. O erro que aparecia falava de "host name" desconhecido
# — mandava procurar no endereço, longe da causa.
#
# Esta versão não monta endereço nenhum. Host e usuário vão em parâmetros
# separados do pg_dump/psql, e a senha vai por PGPASSWORD, que aceita
# qualquer caractere literalmente. Não há o que escapar, o que codificar,
# nem o que montar à mão — e nenhuma senha precisa ser "simples".
#
# O QUE PRECISA ESTAR CONFIGURADO
#   Secrets (Settings > Secrets and variables > Actions):
#     PRODUCAO_DB_PASSWORD      senha do usuário homologacao_leitor_v2
#     HOMOLOGACAO_DB_PASSWORD   senha do banco da homologação
#   Só as senhas. Os endereços você digita no formulário ao apertar o botão
#   — ficam visíveis de propósito: erro em valor secreto é erro que ninguém
#   consegue conferir. (Se os secrets PRODUCAO_DB_HOST / HOMOLOGACAO_DB_HOST
#   já existirem, valem como padrão quando o campo for deixado em branco.)
# =====================================================================
name: homologacao

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite RECRIAR para confirmar que a homologação será sobrescrita'
        required: true
        default: ''
      host_producao:
        description: 'Endereço do Session pooler da PRODUÇÃO — só o host, sem usuário, senha ou porta'
        required: false
        default: 'aws-1-sa-east-1.pooler.supabase.com'
      host_homologacao:
        description: 'Endereço do Session pooler da HOMOLOGAÇÃO — só o host'
        required: false
        default: ''
      modo:
        description: 'completo = tudo do zero | so_finalizar = pula a cópia e roda só senha, identidades e conferências'
        required: false
        type: choice
        default: 'completo'
        options:
          - completo
          - so_finalizar
      mascarar:
        description: 'sim = tudo embaralhado (padrão) | um_cliente = só o cliente de cliente_real vem real | nao = TUDO real'
        required: false
        type: choice
        default: 'sim'
        options:
          - sim
          - um_cliente
          - nao
      cliente_real:
        description: 'Só para mascarar=um_cliente: o tenant_id (uuid) do cliente que virá com dados REAIS'
        required: false
        default: ''

jobs:
  copiar-estrutura:
    name: Copiar a estrutura da produção para a homologação
    runs-on: ubuntu-latest
    concurrency:
      group: homologacao
      cancel-in-progress: false
    env:
      PRODUCAO_REF: diayjpsrcerycycyaxst
      HOMOLOGACAO_REF: fgsblefvdabgdouipigz
      # Usuários do pooler: o formato é sempre "usuario.projeto". Não são
      # segredo, e ficam aqui para não haver o que digitar errado.
      # v2 usa uma identidade nova no Supavisor. A credencial da role anterior
      # ficou presa no cache do pooler mesmo após vários ALTER ROLE; trocar só a
      # senha continuava consultando a entrada antiga.
      PRODUCAO_USER: homologacao_leitor_v2.diayjpsrcerycycyaxst
      HOMOLOGACAO_USER: postgres.fgsblefvdabgdouipigz
      # Os endereços chegam CRUS, como foram digitados. O passo de conferência
      # publica as versões limpas como HOST_PRODUCAO e HOST_HOMOLOGACAO, e são
      # essas que os passos seguintes usam.
      #
      # Os nomes precisam ser diferentes: variável declarada no `env:` do job
      # VENCE o que for escrito em GITHUB_ENV. Se os dois se chamassem igual, a
      # limpeza seria descartada em silêncio — a pior forma de um conserto falhar.
      HOST_PRODUCAO_DIGITADO: ${{ github.event.inputs.host_producao }}
      HOST_HOMOLOGACAO_DIGITADO: ${{ github.event.inputs.host_homologacao }}
    steps:
      - name: Trazer o repositório
        # Para o passo final usar docs/script_conferencia_homologacao.sql — a
        # mesma medição que se cola no SQL Editor. Uma fonte só: se a esteira
        # tivesse a própria cópia da consulta, as duas se afastariam.
        uses: actions/checkout@v4

      - name: Exigir a confirmação digitada
        # O texto digitado chega por variável de ambiente, nunca colado dentro
        # do script: colar conteúdo de formulário direto no shell é o furo
        # clássico de injeção — quem preenche o campo passaria a escrever comando.
        env:
          CONFIRMAR: ${{ github.event.inputs.confirmar }}
        run: |
          if [ "$CONFIRMAR" != "RECRIAR" ]; then
            echo "::error::Confirmação ausente. Rode de novo digitando RECRIAR."
            exit 1
          fi

      - name: Conferir o que foi informado
        env:
          PROD_PASS: ${{ secrets.PRODUCAO_DB_PASSWORD }}
          HOMOLOG_PASS: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
          PROD_HOST_SECRET: ${{ secrets.PRODUCAO_DB_HOST }}
          HOMOLOG_HOST_SECRET: ${{ secrets.HOMOLOGACAO_DB_HOST }}
        run: |
          erro=0
          [ -n "$PROD_PASS" ]    || { echo "::error::Falta o secret PRODUCAO_DB_PASSWORD (senha do usuário homologacao_leitor_v2)"; erro=1; }
          [ -n "$HOMOLOG_PASS" ] || { echo "::error::Falta o secret HOMOLOGACAO_DB_PASSWORD"; erro=1; }

          # Campo em branco cai no secret de host, se ele existir de versões
          # anteriores. Quem já cadastrou não precisa recadastrar nada.
          [ -n "$HOST_PRODUCAO_DIGITADO" ]    || HOST_PRODUCAO_DIGITADO="$PROD_HOST_SECRET"
          [ -n "$HOST_HOMOLOGACAO_DIGITADO" ] || HOST_HOMOLOGACAO_DIGITADO="$HOMOLOG_HOST_SECRET"

          # O endereço ideal é só o host. Como o painel do Supabase também
          # oferece valores no formato usuario@host e URLs completas, aceite
          # esses formatos e extraia apenas o host. Usar o último "@" também
          # tolera senhas antigas contendo esse caractere; a senha efetivamente
          # usada continua vindo separadamente por PGPASSWORD.
          #
          # Espaço em branco é apagado antes de conferir: copiar do painel
          # costuma trazer um espaço no fim, e reprovar por isso — com uma
          # mensagem sobre o final do endereço — seria cruel e inútil.
          #
          # A função devolve o valor limpo em LIMPO, não pela saída: chamar
          # dentro de $(...) rodaria num subshell, onde o `erro=1` se perderia
          # e as mensagens seriam engolidas junto com o resultado.
          conferir_host() {
            nome="$1"; valor="$(printf '%s' "$2" | tr -d '[:space:]')"
            valor="${valor##*@}"
            valor="${valor#*://}"
            valor="${valor%%/*}"
            valor="${valor%%:*}"
            LIMPO="$valor"
            case "$valor" in
              "")
                echo "::error::Endereço da $nome não informado. Preencha o campo no formulário (painel do Supabase > Connect > Session pooler)."
                erro=1 ;;
              *"db."*".supabase.co")
                echo "::error::Endereço da $nome é o de conexão DIRETA (db.<projeto>.supabase.co)."
                echo "::error::Esse endereço só atende por IPv6, e o GitHub não tem IPv6 — a conexão nunca completa."
                echo "::error::Use o do POOLER: painel > Connect > Session pooler; termina em .pooler.supabase.com"
                erro=1 ;;
              *".pooler.supabase.com")
                : ;;
              *)
                echo "::error::Endereço da $nome não parece o do pooler — deveria terminar em .pooler.supabase.com (painel > Connect > Session pooler)."
                erro=1 ;;
            esac
          }

          conferir_host 'PRODUÇÃO'    "$HOST_PRODUCAO_DIGITADO";    HOST_PRODUCAO="$LIMPO"
          conferir_host 'HOMOLOGAÇÃO' "$HOST_HOMOLOGACAO_DIGITADO"; HOST_HOMOLOGACAO="$LIMPO"

          # Os passos seguintes usam a versão já limpa.
          {
            echo "HOST_PRODUCAO=$HOST_PRODUCAO"
            echo "HOST_HOMOLOGACAO=$HOST_HOMOLOGACAO"
          } >> "$GITHUB_ENV"

          echo "Produção   : $PRODUCAO_USER @ $HOST_PRODUCAO"
          echo "Homologação: $HOMOLOGACAO_USER @ $HOST_HOMOLOGACAO"
          exit $erro

      - name: Conferir que o destino NÃO é a produção
        run: |
          # A trava mais importante do arquivo. O destino é apagado e recriado;
          # se algum dia alguém trocar o usuário de destino pelo da produção,
          # por engano ou por copiar-colar, estas linhas impedem o desastre.
          case "$HOMOLOGACAO_USER$HOST_HOMOLOGACAO" in
            *"$PRODUCAO_REF"*)
              echo "::error::O destino aponta para a PRODUÇÃO. Abortando."; exit 1 ;;
          esac
          case "$HOMOLOGACAO_USER" in
            *"$HOMOLOGACAO_REF"*) echo "Destino confere: homologação." ;;
            *) echo "::error::O destino não é o projeto de homologação. Abortando."; exit 1 ;;
          esac

      - name: Cópia CRUA exige ambiente fechado
        env:
          TESTADORES: ${{ secrets.HOMOLOGACAO_TESTADORES }}
          SENHA_USUARIOS: ${{ secrets.HOMOLOGACAO_SENHA_USUARIOS }}
        run: |
          # Com mascarar=nao a homologação passa a conter dado pessoal e dado
          # de saúde reais (LGPD art. 11). Decisão do dono do produto, tomada
          # com o risco explicitado — mas ela só é defensável com o ambiente
          # FECHADO, e "fechado" aqui tem um significado preciso e verificável:
          # ninguém entra com senha compartilhada.
          #
          # O endereço da homologação é uma página pública, e não há como
          # deixar de ser (GitHub Pages de repositório público). Então a
          # proteção não pode estar na obscuridade do link: tem que estar na
          # credencial. Por isso, sem máscara:
          #
          #   · é OBRIGATÓRIO o secret HOMOLOGACAO_TESTADORES — a lista de
          #     quem recebe senha de verdade. Todas as OUTRAS contas recebem
          #     uma senha aleatória que ninguém, nem esta esteira, conhece;
          #   · a senha compartilhada é RECUSADA. Com e-mails reais no banco,
          #     uma senha única e conhecida transformaria a lista de clientes
          #     numa lista de credenciais válidas.
          MODO_MASCARA="${{ github.event.inputs.mascarar }}"
          CLIENTE="$(printf '%s' "${{ github.event.inputs.cliente_real }}" | tr -d '[:space:]')"

          if [ "$MODO_MASCARA" = "sim" ] || [ -z "$MODO_MASCARA" ]; then
            echo "SEM_MASCARA=0" >> "$GITHUB_ENV"
            echo "CLIENTE_REAL=" >> "$GITHUB_ENV"
            echo "Cópia com identidade embaralhada (padrão)."
            exit 0
          fi

          if [ "$MODO_MASCARA" = "um_cliente" ]; then
            # Recorte por CLIENTE: um cliente vem real, os outros 1113 seguem
            # embaralhados. É bem menos exposto que a cópia crua total — mas
            # continua sendo dado pessoal e de saúde de gente real, então as
            # mesmas travas de acesso valem.
            case "$CLIENTE" in
              ????????-????-????-????-????????????) : ;;
              *) echo "::error::mascarar=um_cliente exige cliente_real com um uuid válido."
                 echo "::error::Recebido: '$CLIENTE'"; exit 1 ;;
            esac
            if [ -z "$TESTADORES" ]; then
              echo "::error::O cliente $CLIENTE virá com dados REAIS, mas o secret"
              echo "::error::HOMOLOGACAO_TESTADORES está vazio. Sem ele, as contas reais desse"
              echo "::error::cliente ficariam com a senha compartilhada — e aí qualquer pessoa"
              echo "::error::que soubesse um e-mail dele entraria e leria atestado e CPF reais."
              echo "::error::Cadastre o secret com os e-mails de quem vai testar e rode de novo."
              exit 1
            fi
            echo "SEM_MASCARA=0" >> "$GITHUB_ENV"
            echo "CLIENTE_REAL=$CLIENTE" >> "$GITHUB_ENV"
            echo "::warning::Cliente $CLIENTE virá com dados REAIS. Os demais seguem embaralhados."
            echo "Testadores com senha própria: $(printf '%s' "$TESTADORES" | tr ',' '\n' | grep -c .)"
            exit 0
          fi

          # Daqui para baixo: mascarar = nao (TUDO real).
          if [ -z "$TESTADORES" ]; then
            echo "::error::Cópia crua pedida, mas o secret HOMOLOGACAO_TESTADORES está vazio."
            echo "::error::Sem a lista de testadores, TODAS as contas ficariam sem senha utilizável"
            echo "::error::ou — pior — com a mesma senha. Cadastre o secret com os e-mails REAIS"
            echo "::error::de quem vai testar, separados por vírgula, e rode de novo."
            exit 1
          fi
          # Senha compartilhada + e-mail real = credencial válida para cada
          # cliente da base. Recusa explícita, com o motivo na mensagem.
          case "$SENHA_USUARIOS" in
            ''|'123456'|'1234567'|'senha'|'teste') : ;;
            *) echo "::warning::HOMOLOGACAO_SENHA_USUARIOS existe e será IGNORADO na cópia crua."
               echo "::warning::Sem máscara, cada testador recebe senha individual." ;;
          esac
          if [ -n "$SENHA_USUARIOS" ] && [ "$SENHA_USUARIOS" = "123456" ]; then
            echo "::error::A senha compartilhada ainda é 123456. Com e-mails reais no banco,"
            echo "::error::isso daria acesso a dado de saúde real a quem tiver qualquer e-mail"
            echo "::error::de cliente. Apague o secret HOMOLOGACAO_SENHA_USUARIOS antes de"
            echo "::error::rodar sem máscara — as senhas passam a ser individuais."
            exit 1
          fi
          echo "SEM_MASCARA=1" >> "$GITHUB_ENV"
          echo "CLIENTE_REAL=" >> "$GITHUB_ENV"
          echo "::warning::CÓPIA CRUA autorizada. A homologação conterá dado pessoal e de saúde REAIS."
          echo "Testadores com senha própria: $(printf '%s' "$TESTADORES" | tr ',' '\n' | grep -c .)"

      - name: Instalar as ferramentas do PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Provar que as duas conexões respondem
        env:
          PROD_PASS: ${{ secrets.PRODUCAO_DB_PASSWORD }}
          HOMOLOG_PASS: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
        run: |
          # O GitHub preserva CR/LF acidental no fim de um secret. O Postgres
          # interpreta esse caractere invisível como parte da senha e responde
          # apenas "password authentication failed". Não removemos espaços nem
          # símbolos: eles são válidos e devem continuar literais.
          PROD_PASS="$(printf '%s' "$PROD_PASS" | tr -d '\r\n')"
          HOMOLOG_PASS="$(printf '%s' "$HOMOLOG_PASS" | tr -d '\r\n')"

          # Falhar aqui é falha de credencial, não de estrutura — e a mensagem
          # diz QUAL das duas está errada, antes de qualquer trabalho pesado.
          PGPASSWORD="$PROD_PASS" psql \
            "host=$HOST_PRODUCAO port=5432 user=$PRODUCAO_USER dbname=postgres connect_timeout=10" \
            -tAc 'select current_user' \
            || {
              echo "::error::A PRODUÇÃO recusou homologacao_leitor_v2. Rode a versão atual de docs/script_homologacao_leitor_producao.sql e copie para PRODUCAO_DB_PASSWORD exatamente a senha definida nele."
              exit 1
            }
          PGPASSWORD="$HOMOLOG_PASS" psql -h "$HOST_HOMOLOGACAO" -p 5432 -U "$HOMOLOGACAO_USER" -d postgres \
            -tAc 'select current_user' \
            || { echo "::error::Não conectou na HOMOLOGAÇÃO. Confira o secret HOMOLOGACAO_DB_PASSWORD e o endereço informado."; exit 1; }

      - name: Ler a estrutura da produção (somente leitura, sem dados)
        if: ${{ github.event.inputs.modo != 'so_finalizar' }}
        env:
          PROD_PASS: ${{ secrets.PRODUCAO_DB_PASSWORD }}
        run: |
          # A senha vai por PGPASSWORD: aceita qualquer caractere literalmente,
          # e não aparece na linha de comando (que fica visível no log).
          #
          # As PERMISSÕES vêm junto (não há mais --no-privileges). Sem elas a
          # homologação era um banco que ninguém conseguia ler: os GRANT para
          # anon e authenticated são como as telas enxergam o banco, e a
          # conferência acusava 5643 na produção contra 0 aqui. Um espelho que
          # não se pode abrir não serve para ensaiar tela.
          #
          # --no-owner continua: dono de objeto é específico de cada projeto,
          # e tentar reproduzir donos que não existem aqui só geraria erro.
          export PGPASSWORD="$(printf '%s' "$PROD_PASS" | tr -d '\r\n')"
          pg_dump \
            -h "$HOST_PRODUCAO" -p 5432 -U "$PRODUCAO_USER" -d postgres \
            --schema-only --schema=public \
            --no-owner \
            --no-publications --no-subscriptions \
            -f estrutura_producao.sql
          ls -lh estrutura_producao.sql

      - name: Conferir que NENHUM dado veio junto
        if: ${{ github.event.inputs.modo != 'so_finalizar' }}
        run: |
          # Prova, não confiança: --schema-only não deveria trazer linha
          # nenhuma, e é isto que garante que nenhum CPF, salário ou atestado
          # de gente real saiu da produção. Se aparecer dado, a corrida para
          # antes de tocar na homologação.
          if grep -qE '^(COPY |INSERT INTO )' estrutura_producao.sql; then
            echo "::error::O retrato contém DADOS. Abortando antes de copiar."
            exit 1
          fi
          echo "Nenhuma linha de dado no retrato — só estrutura."

      - name: Recriar o schema public da homologação
        if: ${{ github.event.inputs.modo != 'so_finalizar' }}
        env:
          HOMOLOG_PASS: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
        run: |
          export PGPASSWORD="$(printf '%s' "$HOMOLOG_PASS" | tr -d '\r\n')"
          CONN="-h $HOST_HOMOLOGACAO -p 5432 -U $HOMOLOGACAO_USER -d postgres"

          # POR QUE NÃO É MAIS UM `DROP SCHEMA public CASCADE` E PRONTO
          #
          # Era, e funcionou na primeira corrida — quando o schema estava vazio.
          # Na segunda, com as 351 tabelas dentro, o banco recusou:
          #
          #     ERROR: out of shared memory
          #     HINT: You might need to increase "max_locks_per_transaction"
          #
          # Um DROP CASCADE é UMA transação, e uma transação segura uma trava
          # para CADA objeto que derruba: tabela, índice, política, gatilho,
          # restrição, tipo. São milhares de travas de uma vez, num espaço que
          # o servidor dimensiona no boot e divide entre todas as conexões.
          # Não é ajuste que se faça pelo pooler, e aumentar o limite seria
          # tratar o sintoma: o defeito é pedir tudo de uma vez.
          #
          # Aqui cada objeto cai no seu próprio comando. Sem -1 e sem
          # ON_ERROR_STOP, o psql roda cada um em sua própria transação: as
          # travas são devolvidas a cada comando, e o total simultâneo nunca
          # passa do que um objeto precisa.
          gerar() { psql $CONN -tA -c "$1"; }
          {
            # Tabelas primeiro: o CASCADE de cada uma leva junto os índices,
            # políticas, gatilhos, restrições e visões que dependiam dela.
            gerar "SELECT format('DROP TABLE IF EXISTS public.%I CASCADE;', c.relname)
                     FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                    WHERE n.nspname='public' AND c.relkind IN ('r','p','f')"
            gerar "SELECT format('DROP VIEW IF EXISTS public.%I CASCADE;', c.relname)
                     FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                    WHERE n.nspname='public' AND c.relkind='v'"
            gerar "SELECT format('DROP MATERIALIZED VIEW IF EXISTS public.%I CASCADE;', c.relname)
                     FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                    WHERE n.nspname='public' AND c.relkind='m'"
            # DROP ROUTINE cobre função e procedimento; agregado tem comando próprio.
            gerar "SELECT format('DROP %s IF EXISTS public.%I(%s) CASCADE;',
                                 CASE p.prokind WHEN 'a' THEN 'AGGREGATE' ELSE 'ROUTINE' END,
                                 p.proname, pg_get_function_identity_arguments(p.oid))
                     FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
                    WHERE n.nspname='public'"
            # Tipos próprios (os enums do projeto). O NOT EXISTS descarta os
            # tipos-linha que o PostgreSQL cria junto com cada tabela: esses
            # já caíram com ela, e pedir para derrubá-los daria erro.
            gerar "SELECT format('DROP TYPE IF EXISTS public.%I CASCADE;', t.typname)
                     FROM pg_type t JOIN pg_namespace n ON n.oid=t.typnamespace
                    WHERE n.nspname='public' AND t.typtype IN ('e','c','d','r')
                      AND NOT EXISTS (SELECT 1 FROM pg_class c WHERE c.reltype=t.oid)"
            gerar "SELECT format('DROP SEQUENCE IF EXISTS public.%I CASCADE;', c.relname)
                     FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                    WHERE n.nspname='public' AND c.relkind='S'"
          } > derrubar.sql

          echo "Objetos a derrubar: $(grep -c ';' derrubar.sql || true)"
          psql $CONN -q -f derrubar.sql 2>&1 | tee derrubada.log | tail -20
          echo "Erros ao derrubar: $(grep -c 'ERROR:' derrubada.log || true)"

          # Agora o schema está vazio ou quase, e o DROP final custa poucas travas.
          psql $CONN -v ON_ERROR_STOP=1 \
            -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'

          # Prova de que ficou limpo: restaurar sobre sobras daria erro de
          # "já existe", e o retrato entraria pela metade sem ninguém notar.
          sobrou=$(psql $CONN -tAc "SELECT count(*) FROM pg_class c
                     JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public'")
          echo "Objetos restantes no schema public: $sobrou"
          if [ "$sobrou" -ne 0 ]; then
            echo "::error::O schema public não ficou vazio. Restaurar por cima entregaria uma cópia parcial."
            exit 1
          fi

      - name: Instalar na homologação as mesmas extensões da produção
        if: ${{ github.event.inputs.modo != 'so_finalizar' }}
        env:
          PROD_PASS: ${{ secrets.PRODUCAO_DB_PASSWORD }}
          HOMOLOG_PASS: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
        run: |
          # POR QUE ESTE PASSO EXISTE
          #
          # O retrato é só do schema `public`, e extensão não mora lá. Mas há
          # objeto em `public` que DEPENDE de extensão: o índice de busca por
          # título de ocupação (idx_cbo_titulo_trgm, em cbo_ocupacoes) usa o
          # operador `extensions.gin_trgm_ops`, do pg_trgm. Num projeto novo o
          # pg_trgm não vem instalado, e a criação desse índice falhava com
          #
          #     ERROR: operator class "extensions.gin_trgm_ops" does not exist
          #
          # Era exatamente o índice que faltava: 855 na produção, 854 aqui.
          # Um único objeto, e a busca de CBO deixaria de ter índice justamente
          # no ambiente onde se testa se o script aplica.
          #
          # A lista não é escrita à mão: vem da produção. Assim vale para
          # qualquer extensão que a produção venha a usar, e não só para esta.
          # O `WITH SCHEMA` preserva onde cada uma mora — o operador é
          # referenciado com o schema no nome, então instalar no lugar errado
          # não resolveria nada.
          PGPASSWORD="$(printf '%s' "$PROD_PASS" | tr -d '\r\n')" \
          psql -h "$HOST_PRODUCAO" -p 5432 -U "$PRODUCAO_USER" -d postgres -tA \
            -v ON_ERROR_STOP=1 -c "
            SELECT format('CREATE SCHEMA IF NOT EXISTS %I;'
                          || E'\nCREATE EXTENSION IF NOT EXISTS %I WITH SCHEMA %I;',
                          n.nspname, e.extname, n.nspname)
              FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace
             WHERE e.extname <> 'plpgsql'
             ORDER BY e.extname;" > extensoes.sql

          echo "Extensões que a produção usa:"
          cat extensoes.sql

          # Sem ON_ERROR_STOP: extensão que este projeto não pode instalar não
          # deve derrubar a corrida aqui. Se alguma fizer falta de verdade, o
          # objeto que depende dela falha na restauração e a conferência final
          # reprova — com o nome do objeto na mensagem.
          export PGPASSWORD="$(printf '%s' "$HOMOLOG_PASS" | tr -d '\r\n')"
          psql -h "$HOST_HOMOLOGACAO" -p 5432 -U "$HOMOLOGACAO_USER" -d postgres \
            -f extensoes.sql 2>&1 | tee extensoes.log | tail -20
          echo "Erros ao instalar extensões: $(grep -c 'ERROR:' extensoes.log || true)"

      - name: Aplicar a estrutura na homologação
        if: ${{ github.event.inputs.modo != 'so_finalizar' }}
        env:
          HOMOLOG_PASS: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
        run: |
          export PGPASSWORD="$(printf '%s' "$HOMOLOG_PASS" | tr -d '\r\n')"
          # Sem ON_ERROR_STOP: restaurar retrato em projeto novo sempre reclama
          # de extensão e permissão que o Supabase já criou sozinho. O que
          # importa é o resultado final, conferido no passo seguinte.
          psql -h "$HOST_HOMOLOGACAO" -p 5432 -U "$HOMOLOGACAO_USER" -d postgres \
            -f estrutura_producao.sql 2>&1 | tee restauracao.log | tail -40

          # O psql NÃO começa a linha de erro com "ERROR": ele prefixa com
          # "psql:arquivo:linha:". A versão anterior contava com grep '^ERROR' e
          # por isso imprimia "0 erros" SEMPRE — inclusive na corrida em que um
          # índice não foi criado. Contador que só sabe dizer zero é pior que
          # contador nenhum: o zero é lido como prova.
          echo "---"
          # Um erro é esperado e não significa nada: o retrato traz
          # `CREATE SCHEMA public`, e o passo anterior já criou o schema. Fica
          # separado dos outros para não inflar a contagem — número que mistura
          # ruído com sinal volta a não querer dizer nada, que foi o defeito
          # anterior por outro caminho.
          grep 'ERROR:' restauracao.log | sed 's/^psql:[^:]*:[0-9]*: //' \
            | grep -v 'schema "public" already exists' > erros_reais.log || true
          erros=$(wc -l < erros_reais.log)
          echo "Erros durante a restauração (fora o 'public already exists' esperado): $erros"
          if [ "$erros" -gt 0 ]; then
            echo "Mensagens distintas (o objeto que falhou aparece na linha):"
            sort erros_reais.log | uniq -c | sort -rn | head -30
          fi

      - name: Copiar os dados com a identificação embaralhada
        if: ${{ github.event.inputs.modo != 'so_finalizar' }}
        env:
          PROD_PASS: ${{ secrets.PRODUCAO_DB_PASSWORD }}
          HOMOLOG_PASS: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
          TEMPERO_SECRET: ${{ secrets.HOMOLOGACAO_TEMPERO }}
        run: |
          set -o pipefail
          PP="$(printf '%s' "$PROD_PASS"    | tr -d '\r\n')"
          HP="$(printf '%s' "$HOMOLOG_PASS" | tr -d '\r\n')"
          prod()    { PGPASSWORD="$PP" psql -h "$HOST_PRODUCAO"    -p 5432 -U "$PRODUCAO_USER"    -d postgres "$@"; }
          homolog() { PGPASSWORD="$HP" psql -h "$HOST_HOMOLOGACAO" -p 5432 -U "$HOMOLOGACAO_USER" -d postgres "$@"; }

          # O tempero decide o mapeamento "CPF real -> CPF falso". Precisa ser
          # ESTÁVEL entre corridas (senão o mesmo colaborador vira uma pessoa
          # diferente a cada cópia) e SECRETO (senão qualquer um confere se um
          # CPF conhecido virou tal valor, e a máscara deixa de mascarar).
          # Sem secret próprio, deriva da senha do banco: já é secreta e já é
          # estável, e não cria mais um item para alguém esquecer de cadastrar.
          if [ -n "$TEMPERO_SECRET" ]; then
            TEMPERO="$TEMPERO_SECRET"
          else
            TEMPERO="$(printf '%s' "$HP" | sha256sum | cut -c1-32)"
            echo "Sem o secret HOMOLOGACAO_TEMPERO; usando um derivado da senha do banco."
          fi
          echo "::add-mask::$TEMPERO"

          echo "== Lendo a estrutura das colunas na produção (somente leitura)"
          prod -tA -v ON_ERROR_STOP=1 -f scripts/homologacao/catalogo_colunas.sql > catalogo.tsv
          if [ "$SEM_MASCARA" = "1" ]; then
            echo "::warning::Copia CRUA: a homologacao recebera nome, CPF, e-mail e atestado REAIS."
            python3 scripts/homologacao/gerar_copia_mascarada.py catalogo.tsv "$TEMPERO" --sem-mascara > plano.tsv
          elif [ -n "$CLIENTE_REAL" ]; then
            echo "Cliente $CLIENTE_REAL vira REAL; os demais seguem embaralhados."
            python3 scripts/homologacao/gerar_copia_mascarada.py catalogo.tsv "$TEMPERO" --cliente-real "$CLIENTE_REAL" > plano.tsv
          else
            python3 scripts/homologacao/gerar_copia_mascarada.py catalogo.tsv "$TEMPERO" > plano.tsv
          fi
          echo "Tabelas a copiar: $(wc -l < plano.tsv)"

          # ---------------------------------------------------------------
          # Soltar as amarras ANTES de carregar.
          #
          # Duas coisas atrapalhariam a carga, e as duas em silêncio:
          #
          #  · as 627 chaves estrangeiras exigiriam ordem de dependência, e
          #    10 tabelas referenciam a si mesmas — não existe ordem que
          #    resolva. Derrubar e recriar depois é o caminho, e a recriação
          #    ainda VALIDA a carga de brinde: se a máscara tivesse quebrado
          #    alguma ligação, ela falha aqui.
          #
          #  · os 589 gatilhos dispararIam a cada linha inserida: os de
          #    auditoria gravariam um histórico que nunca aconteceu, e os de
          #    "atualizado_em" reescreveriam as datas — justamente o dado que
          #    dá realismo ao ensaio. DISABLE TRIGGER USER basta e não exige
          #    superusuário; os gatilhos internos de chave estrangeira ficam
          #    de fora porque as chaves já saíram.
          # ---------------------------------------------------------------
          echo "== Guardando e derrubando as chaves estrangeiras"
          homolog -tA -v ON_ERROR_STOP=1 -c "
            SELECT format('ALTER TABLE %s ADD CONSTRAINT %I %s;',
                          c.conrelid::regclass, c.conname, pg_get_constraintdef(c.oid))
              FROM pg_constraint c JOIN pg_class t ON t.oid = c.conrelid
              JOIN pg_namespace n ON n.oid = t.relnamespace
             WHERE n.nspname='public' AND c.contype='f';" > recriar_fks.sql
          echo "Chaves estrangeiras guardadas: $(grep -c ';' recriar_fks.sql || true)"

          homolog -tA -v ON_ERROR_STOP=1 -c "
            SELECT format('ALTER TABLE %s DROP CONSTRAINT IF EXISTS %I;',
                          c.conrelid::regclass, c.conname)
              FROM pg_constraint c JOIN pg_class t ON t.oid = c.conrelid
              JOIN pg_namespace n ON n.oid = t.relnamespace
             WHERE n.nspname='public' AND c.contype='f';" > derrubar_fks.sql
          homolog -q -v ON_ERROR_STOP=1 -f derrubar_fks.sql

          homolog -tA -v ON_ERROR_STOP=1 -c "
            SELECT format('ALTER TABLE public.%I DISABLE TRIGGER USER;', c.relname)
              FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public' AND c.relkind IN ('r','p');" > desligar_gatilhos.sql
          homolog -q -f desligar_gatilhos.sql 2>&1 | grep -c 'ERROR:' || true

          # ---------------------------------------------------------------
          # A cópia. auth.users primeiro: 34 chaves do public apontam para lá.
          #
          # E ANTES, esvaziar auth.users no destino. O passo "Recriar o
          # schema" só recria o `public` — auth.users mora fora dele e
          # SOBREVIVE entre corridas. Na primeira corrida em que a carga de
          # usuários deu certo, ninguém notou; na seguinte, os mesmos
          # usuários já estavam lá e o COPY colidiu na chave primária
          # (users_pkey, "already exists" na linha 1). O CASCADE leva junto
          # as tabelas do auth que apontam para users (identities, sessions):
          # são sobras da corrida anterior apontando para usuários que vão
          # deixar de existir.
          # ---------------------------------------------------------------
          homolog -q -v ON_ERROR_STOP=1 -c 'TRUNCATE auth.users CASCADE;'
          echo "auth.users esvaziado no destino (sobra da corrida anterior)."

          echo "== Copiando (a máscara é aplicada no SELECT, dentro da produção)"
          total=0; falhas=0; incompletas=0
          copiar_uma() {
            tabela="$1"; selecao="$2"; colunas="$3"
            if prod -qAt -c "COPY (SELECT $selecao FROM $tabela) TO STDOUT" \
               | homolog -q -c "COPY $tabela ($colunas) FROM STDIN" 2>erro.txt; then
              linhas=$(homolog -tAc "SELECT count(*) FROM $tabela")
              total=$((total + linhas))

              # CONTAGEM DOS DOIS LADOS, e não só do destino.
              #
              # A primeira corrida ensinou por que: a leitura da produção
              # esbarrava nas políticas de segurança por linha, que o papel de
              # leitura não isenta. Ali deu erro, e erro se vê. Mas o mesmo
              # problema tem uma versão silenciosa — política valendo e funções
              # liberadas devolvem SÓ as linhas visíveis para quem não tem
              # sessão, ou seja, quase nenhuma. A cópia terminaria "bem", com
              # um espelho vazio que ninguém perceberia estar vazio.
              #
              # Comparar o que saiu com o que entrou fecha essa porta,
              # independentemente de qual permissão esteja faltando.
              origem=$(prod -tAc "SELECT count(*) FROM $tabela" 2>/dev/null || echo '?')
              if [ "$origem" != "$linhas" ]; then
                incompletas=$((incompletas + 1))
                printf '  %-46s DIVERGIU: producao %s, homologacao %s\n' \
                       "$tabela" "$origem" "$linhas"
              else
                # O `|| true` não é enfeite: sem ele, a comparação falsa numa
                # tabela VAZIA devolveria 1, e como o shell da esteira roda com
                # `bash -e`, a corrida abortaria na primeira tabela sem linhas.
                { [ "$linhas" -gt 0 ] && printf '  %-52s %8s linhas\n' "$tabela" "$linhas"; } || true
              fi
            else
              falhas=$((falhas + 1))
              echo "  FALHOU: $tabela"
              sed 's/^/      /' erro.txt | head -3
            fi
          }

          grep '^auth\.' plano.tsv > plano_auth.tsv || true
          grep -v '^auth\.' plano.tsv > plano_public.tsv || true
          while IFS=$'\t' read -r t s c; do copiar_uma "$t" "$s" "$c"; done < plano_auth.tsv
          while IFS=$'\t' read -r t s c; do copiar_uma "$t" "$s" "$c"; done < plano_public.tsv
          echo "Linhas copiadas: $total | tabelas com falha: $falhas | incompletas: $incompletas"

          # ---------------------------------------------------------------
          # Reatar as amarras. A recriação das chaves é a conferência: ela
          # percorre os dados e recusa se alguma ligação não fechar.
          # ---------------------------------------------------------------
          echo "== Religando gatilhos e recriando as chaves estrangeiras"
          homolog -tA -c "
            SELECT format('ALTER TABLE public.%I ENABLE TRIGGER USER;', c.relname)
              FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public' AND c.relkind IN ('r','p');" > religar_gatilhos.sql
          homolog -q -f religar_gatilhos.sql 2>&1 | grep 'ERROR:' | head -5 || true

          homolog -q -f recriar_fks.sql 2>&1 | tee fks.log | grep 'ERROR:' | head -10 || true
          fk_erros=$(grep -c 'ERROR:' fks.log || true)
          echo "Chaves estrangeiras que NÃO voltaram: $fk_erros"

          # Sequências: sem isto, o próximo cadastro na homologação tentaria um
          # id que já existe e falharia com erro de duplicidade.
          homolog -tA -c "
            SELECT format('SELECT setval(%L, COALESCE((SELECT max(%I) FROM public.%I), 1));',
                          quote_ident(n.nspname)||'.'||quote_ident(s.relname), a.attname, t.relname)
              FROM pg_class s
              JOIN pg_namespace n ON n.oid = s.relnamespace AND n.nspname='public'
              JOIN pg_depend d ON d.objid = s.oid AND d.deptype IN ('a','i')
              JOIN pg_class t ON t.oid = d.refobjid
              JOIN pg_attribute a ON a.attrelid = t.oid AND a.attnum = d.refobjsubid
             WHERE s.relkind = 'S';" > sequencias.sql
          homolog -q -f sequencias.sql > /dev/null 2>&1 || true

          if [ "$falhas" -gt 0 ] || [ "$fk_erros" -gt 0 ] || [ "$incompletas" -gt 0 ]; then
            echo "::error::A cópia dos dados não fechou. Veja acima a tabela e a mensagem."
            if [ "$incompletas" -gt 0 ]; then
              echo "::error::Tabelas com contagem diferente da produção: geralmente é o papel de"
              echo "::error::leitura sem isenção de RLS. Rode de novo docs/script_homologacao_leitor_producao.sql"
              echo "::error::na produção — a conferência dele agora tem a linha 'Isento de RLS'."
            fi
            exit 1
          fi

      - name: Provar que nenhum dado identificável atravessou
        env:
          HOMOLOG_PASS: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
          SENHA_USUARIOS: ${{ secrets.HOMOLOGACAO_SENHA_USUARIOS }}
          TESTADORES: ${{ secrets.HOMOLOGACAO_TESTADORES }}
        run: |
          export PGPASSWORD="$(printf '%s' "$HOMOLOG_PASS" | tr -d '\r\n')"
          homolog() { psql -h "$HOST_HOMOLOGACAO" -p 5432 -U "$HOMOLOGACAO_USER" -d postgres "$@"; }

          # Conferência POSITIVA: em vez de procurar dado real — que eu não
          # tenho com que comparar, e cuja ausência não se prova por amostra —
          # confere que a marca da máscara está em TODAS as linhas. Um CPF que
          # não comece com 9 é um CPF que escapou.
          # ---------------------------------------------------------------
          # ANTES DE MEDIR: remover contas nascidas NO PRÓPRIO destino.
          #
          # O endereço da homologação é público e tem um botão "Cadastre sua
          # empresa". Alguém vai clicar — alguém CLICOU — e a conta criada ali
          # tem e-mail de verdade e metadado preenchido. A trava tratou isso
          # como vazamento e apagou os 625 mil registros da cópia por causa
          # de UMA conta de cadastro. Vazamento é dado da PRODUÇÃO escapando
          # da máscara; conta digitada aqui dentro não é isso.
          #
          # A régua que separa os dois é de construção: todo usuário vindo da
          # cópia tem e-mail @exemplo.invalid, sem exceção. Conta com e-mail
          # diferente nasceu aqui — e a resposta proporcional é remover a
          # conta, não o mundo. Removem-se primeiro as linhas que apontam
          # para ela (as chaves vêm do catálogo, em duas passadas, para
          # cobrir dependente de dependente), depois a conta.
          #
          # O CPF fora do padrão continua acionando o apaga-tudo: ali não há
          # como separar cadastro local de falha da máscara, e falha da
          # máscara é a emergência real.
          # ---------------------------------------------------------------
          cat > remover_cadastros_locais.sql <<'FIM_SQL'
          -- Desce a árvore de dependências antes de apagar: linha que aponta
          -- para linha que aponta para a conta (neto) travaria o DELETE — e
          -- como tudo roda numa transação, travaria a remoção INTEIRA. A
          -- primeira versão usava "duas passadas" e caiu exatamente nisso no
          -- ensaio. Assume chave primária de uma coluna uuid, que é o padrão
          -- deste schema; tabela fora do padrão é pulada (e, se travar o
          -- DELETE, o erro aparece em vez de sumir).
          CREATE FUNCTION pg_temp.apagar_dependentes(
            p_tab regclass, p_ids uuid[], p_prof int DEFAULT 0)
          RETURNS void LANGUAGE plpgsql AS $f$
          DECLARE r record; filhos uuid[]; pkcol text;
          BEGIN
            IF coalesce(array_length(p_ids,1),0) = 0 OR p_prof > 6 THEN
              RETURN;
            END IF;
            FOR r IN
              SELECT c.conrelid::regclass AS tabela, a.attname AS coluna
                FROM pg_constraint c
                JOIN unnest(c.conkey) u(attnum) ON true
                JOIN pg_attribute a ON a.attrelid = c.conrelid
                                   AND a.attnum = u.attnum
               WHERE c.contype = 'f' AND c.confrelid = p_tab
            LOOP
              BEGIN
                SELECT a.attname INTO pkcol
                  FROM pg_index i
                  JOIN pg_attribute a ON a.attrelid = i.indrelid
                                     AND a.attnum = ANY(i.indkey)
                 WHERE i.indrelid = r.tabela AND i.indisprimary
                 LIMIT 1;
                filhos := '{}';
                IF pkcol IS NOT NULL THEN
                  EXECUTE format(
                    'SELECT coalesce(array_agg(%I),''{}'') FROM %s WHERE %I = ANY($1)',
                    pkcol, r.tabela, r.coluna) INTO filhos USING p_ids;
                END IF;
              EXCEPTION WHEN OTHERS THEN
                filhos := '{}';  -- chave que não é uuid: não desce por aqui
              END;
              PERFORM pg_temp.apagar_dependentes(r.tabela, filhos, p_prof + 1);
              EXECUTE format('DELETE FROM %s WHERE %I = ANY($1)',
                             r.tabela, r.coluna) USING p_ids;
            END LOOP;
          END $f$;

          DO $limpa$
          DECLARE ids uuid[];
          BEGIN
            SELECT coalesce(array_agg(id), '{}') INTO ids
              FROM auth.users
             WHERE email IS NOT NULL AND email NOT LIKE '%@exemplo.invalid';
            IF coalesce(array_length(ids,1),0) = 0 THEN
              RAISE NOTICE 'Nenhuma conta criada no destino.';
              RETURN;
            END IF;
            PERFORM pg_temp.apagar_dependentes('auth.users'::regclass, ids);
            DELETE FROM auth.users WHERE id = ANY(ids);
            RAISE NOTICE 'Contas criadas no destino, removidas: %',
                         array_length(ids,1);
          END $limpa$;
          FIM_SQL
          homolog -f remover_cadastros_locais.sql 2>&1 \
            | sed 's/^psql:[^:]*:[0-9]*: //' | grep -E 'NOTICE|ERROR' || true

          # Na cópia CRUA estas medidas perderiam o sentido: elas provam que a
          # máscara agiu, e não há máscara. Pior — elas dispararIam o
          # apaga-tudo justamente porque o dado real chegou, que é o que foi
          # pedido. Então saem de cena, e no lugar fica o registro explícito
          # de que o ambiente carrega dado real (o log da corrida é o
          # documento de quando isso passou a valer).
          if [ "$SEM_MASCARA" = "1" ]; then
            echo "::warning::Cópia CRUA: a conferência de máscara não se aplica."
            echo "A homologação contém dado pessoal e de saúde REAIS, por decisão registrada."
            echo "Acesso somente pelas contas da lista de testadores, com senha individual."
            n_reais=$(homolog -tAc "SELECT count(*) FROM auth.users WHERE email NOT LIKE '%@exemplo.invalid'" 2>/dev/null || echo '?')
            echo "Contas com e-mail real no destino: $n_reais"
            exit 0
          fi

          # No modo um_cliente as linhas do cliente escolhido são REAIS por
          # decisão — CPF que não começa com 9, e-mail que não é .invalid.
          # Sem excluí-las da medição, a trava as leria como vazamento e
          # apagaria a cópia inteira, fazendo exatamente o oposto do pedido.
          # O resto da base continua sendo medido com o mesmo rigor de sempre:
          # se a máscara falhar para QUALQUER outro cliente, o apaga-tudo
          # dispara igual.
          if [ -n "$CLIENTE_REAL" ]; then
            EXCETO_UB="AND tenant_id <> '$CLIENTE_REAL'::uuid"
            EXCETO_AU="AND id NOT IN (SELECT user_id FROM public.profiles WHERE tenant_id = '$CLIENTE_REAL'::uuid)"
            echo "Cliente real $CLIENTE_REAL excluído da medição (é real por decisão)."
          else
            EXCETO_UB=""; EXCETO_AU=""
          fi

          echo "MEDIDA                                   FORA DO PADRAO"
          fugiu=0
          conferir() {
            n=$(homolog -tAc "$2" 2>/dev/null || echo 0)
            printf '%-40s %8s\n' "$1" "$n"
            [ "${n:-0}" -gt 0 ] && fugiu=1 || true
          }
          # CPF VAZIO NÃO É CPF ESCAPADO. A máscara só deixa passar, sem
          # transformar, dois valores: NULL e a string vazia — e vazio não
          # identifica ninguém. A primeira versão desta conferência contava o
          # vazio como fuga, e UM cadastro sem CPF na produção derrubou uma
          # corrida inteira que tinha copiado 624 mil linhas certas. Por isso
          # o filtro exige que sobre ALGUM dígito antes de julgar o primeiro.
          conferir "CPF que nao comeca com 9" "
            SELECT coalesce(sum(n),0) FROM (
              SELECT count(*) n FROM public.usuarios_base
               WHERE cpf IS NOT NULL
                 AND regexp_replace(cpf,'[^0-9]','','g') <> ''
                 AND left(regexp_replace(cpf,'[^0-9]','','g'),1) <> '9'
                 $EXCETO_UB
            ) x;"
          conferir "e-mail fora de .invalid (auth)" "
            SELECT count(*) FROM auth.users
             WHERE email IS NOT NULL AND email NOT LIKE '%@exemplo.invalid'
               $EXCETO_AU;"
          conferir "metadado de usuario nao esvaziado" "
            SELECT count(*) FROM auth.users
             WHERE raw_user_meta_data IS NOT NULL AND raw_user_meta_data <> '{}'::jsonb
               $EXCETO_AU;"

          if [ "$fugiu" -ne 0 ]; then
            echo "::error::Dado identificável chegou à homologação. Apagando os dados por precaução."
            # NÃO é um DROP SCHEMA CASCADE: com as 351 tabelas cheias, esse
            # comando único estoura o limite de travas do banco ("out of
            # shared memory") — foi exatamente o que aconteceu na primeira
            # vez que esta limpeza de emergência disparou, e ela FALHOU no
            # único momento em que não podia falhar. TRUNCATE tabela a
            # tabela descarta as linhas sem derrubar objeto nenhum: barato
            # em travas, e o que importa aqui é o DADO sumir.
            homolog -tA -c "
              SELECT format('TRUNCATE TABLE %s.%I CASCADE;', n.nspname, c.relname)
                FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
               WHERE c.relkind IN ('r','p')
                 AND (n.nspname = 'public'
                      OR (n.nspname = 'auth' AND c.relname = 'users'));" > limpar.sql
            homolog -q -f limpar.sql 2>&1 | grep -c 'ERROR:' || true
            restante=$(homolog -tAc "
              SELECT coalesce(sum(x.n),0) FROM (
                SELECT (SELECT count(*) FROM public.usuarios_base) AS n
                UNION ALL SELECT (SELECT count(*) FROM auth.users)) x;" || echo '?')
            echo "Linhas restantes em usuarios_base + auth.users após a limpeza: $restante"
            exit 1
          fi
          echo "Nenhum dado identificável na homologação."

          # ---------------------------------------------------------------
          # DEIXAR auth.users NO FORMATO QUE O SERVIÇO DE LOGIN ESPERA.
          #
          # A máscara é cega ao significado de cada campo — e foi por isso que
          # o login passou a responder "Unexpected failure": erro DO SERVIÇO
          # de autenticação, não credencial errada, e a mensagem não diz qual
          # campo é. Duas coisas atrapalhavam:
          #
          #  · raw_app_meta_data guarda COMO a pessoa entra ({"provider":
          #    "email"}). É jsonb, então a máscara o esvaziou junto com o
          #    resto — e ali também moram nome e e-mail, então esvaziar era
          #    certo. Repor SÓ o provider não vaza nada: é 'email' para
          #    todos. raw_user_meta_data, onde os dados pessoais ficam,
          #    continua vazio.
          #
          #  · os campos de token são lidos como texto simples. NULO faz o
          #    serviço quebrar; vazio é o que ele espera. A máscara preserva
          #    o NULO da origem — correto como máscara, incompatível aqui.
          #
          # O SQL vai para um ARQUIVO, e não para dentro de -c "...": o bloco
          # usa $norm$ como delimitador, e escapar cifrão dentro de aspas do
          # shell é a receita de um erro que só aparece em execução.
          cat > normalizar_auth.sql <<'FIM_SQL'
          DO $norm$
          DECLARE
            c text;
            colunas text[] := ARRAY['confirmation_token','recovery_token',
                                    'email_change','email_change_token_new',
                                    'email_change_token_current',
                                    'reauthentication_token','phone_change',
                                    'phone_change_token'];
          BEGIN
            FOREACH c IN ARRAY colunas LOOP
              IF EXISTS (SELECT 1 FROM information_schema.columns
                          WHERE table_schema='auth' AND table_name='users'
                            AND column_name=c) THEN
                EXECUTE format('UPDATE auth.users SET %I = %L WHERE %I IS NULL',
                               c, '', c);
              END IF;
            END LOOP;
            UPDATE auth.users
               SET raw_app_meta_data = jsonb_build_object(
                     'provider','email','providers', jsonb_build_array('email'))
             WHERE raw_app_meta_data IS NULL OR raw_app_meta_data = '{}'::jsonb;
          END $norm$;
          FIM_SQL
          homolog -q -v ON_ERROR_STOP=1 -f normalizar_auth.sql \
            && echo "auth.users normalizado para o serviço de login."

          # Senha de entrada. O hash real foi invalidado na leitura, então sem
          # isto ninguém entra — o que é o padrão seguro, não um defeito.
          # A senha vai por variável do psql (:'senha'), não colada no texto
          # do comando: senha com apóstrofo quebraria o SQL, e senha com
          # apóstrofo bem escolhido escreveria SQL.
          #
          # E o SQL vai por ARQUIVO (-f), não por -c: o psql NÃO substitui
          # variáveis em comandos passados por -c — o :'senha' chega cru ao
          # banco e quebra com "syntax error at or near :". Foi exatamente o
          # erro da corrida 23, engolido no meio de um passo verde: tudo
          # funcionou menos a senha, e ninguém conseguia entrar.
          #
          # O arquivo é criado AQUI FORA do if de propósito: o marcador que
          # encerra um heredoc precisa começar na coluna zero do script, e
          # dentro do if ele ficaria indentado — o bash não o reconheceria e
          # engoliria o resto do passo para dentro do arquivo, em silêncio.
          cat > aplicar_senha.sql <<'FIM_SQL'
          UPDATE auth.users
             SET encrypted_password = crypt(:'senha', gen_salt('bf')),
                 email_confirmed_at = COALESCE(email_confirmed_at, now());
          FIM_SQL

          # Heredoc no nível EXTERNO, nunca dentro de um if: o marcador que
          # encerra precisa começar na coluna zero depois que o YAML tira a
          # indentação comum. Dentro do if ele ficaria indentado, o bash não o
          # reconheceria e engoliria o resto do passo para dentro do arquivo,
          # em silêncio. Já aconteceu neste mesmo arquivo (#314).
          cat > liberar_testadores.sql <<'FIM_SQL'
          -- Só os e-mails da lista recebem senha utilizável. A senha é
          -- SORTEADA aqui (12 bytes -> 24 caracteres hex), não escolhida por
          -- ninguém: senha decidida por pessoa acaba reaproveitada de outro
          -- sistema, e senha guardada num secret acaba circulando por
          -- mensagem. Fica numa tabela só para ser impressa uma vez no log
          -- da corrida, e o passo seguinte a apaga.
          DROP TABLE IF EXISTS homologacao_testadores_senhas;
          CREATE TABLE homologacao_testadores_senhas (
            email text PRIMARY KEY, senha_provisoria text NOT NULL);

          -- A lista chega como 'a@x.com, b@y.com'. O trim tira o espaço
          -- depois da vírgula; o lower casa com o e-mail gravado.
          WITH pedidos AS (
            SELECT lower(btrim(e)) AS email
              FROM unnest(string_to_array(:'lista', ',')) e
             WHERE btrim(e) <> ''
          ), sorteio AS (
            SELECT p.email, encode(gen_random_bytes(12), 'hex') AS senha
              FROM pedidos p
             WHERE EXISTS (SELECT 1 FROM auth.users u WHERE lower(u.email) = p.email)
          ), gravar AS (
            INSERT INTO homologacao_testadores_senhas (email, senha_provisoria)
            SELECT email, senha FROM sorteio RETURNING email, senha_provisoria
          )
          UPDATE auth.users u
             SET encrypted_password = crypt(g.senha_provisoria, gen_salt('bf')),
                 email_confirmed_at = COALESCE(u.email_confirmed_at, now())
            FROM gravar g
           WHERE lower(u.email) = g.email;

          -- E-mail da lista que não existe no banco é erro de digitação, e
          -- erro de digitação aqui deixa a pessoa sem conseguir entrar sem
          -- saber por quê. Avisa alto, mas não derruba a corrida.
          --
          -- A lista entra por set_config, e NÃO por :'lista' dentro do bloco:
          -- o psql não substitui variável dentro de aspas-dólar, então a
          -- primeira versão morreu com "syntax error at or near :" — o mesmo
          -- tipo de armadilha do -c que já custou uma corrida (#314). Aqui a
          -- substituição acontece na chamada da função, que é SQL comum, e o
          -- bloco lê o valor de volta com current_setting.
          SELECT set_config('homologacao.lista_testadores', :'lista', false);
          DO $aviso$
          DECLARE faltou text;
          BEGIN
            SELECT string_agg(btrim(e), ', ') INTO faltou
              FROM unnest(string_to_array(
                     current_setting('homologacao.lista_testadores'), ',')) e
             WHERE btrim(e) <> ''
               AND NOT EXISTS (SELECT 1 FROM auth.users u
                                WHERE lower(u.email) = lower(btrim(e)));
            IF faltou IS NOT NULL THEN
              RAISE WARNING 'Testadores sem conta na base copiada: %', faltou;
            END IF;
          END $aviso$;
          FIM_SQL

          if [ "$SEM_MASCARA" = "1" ]; then
            # ─────────────────────────────────────────────────────────────
            # CÓPIA CRUA: senha INDIVIDUAL, nunca compartilhada.
            #
            # Os e-mails aqui são os reais dos clientes. Uma senha única e
            # conhecida transformaria a base de clientes numa base de
            # credenciais — quem soubesse o e-mail de qualquer pessoa entraria
            # e leria atestado, afastamento e CPF dela. Então:
            #
            #   · TODA conta recebe primeiro uma senha aleatória de 32 bytes,
            #     gerada no banco e que ninguém — nem esta esteira, nem quem
            #     lê o log — chega a ver. Na prática, ninguém entra;
            #   · depois, só os e-mails da lista HOMOLOGACAO_TESTADORES
            #     recebem uma senha utilizável, também sorteada aqui, e
            #     impressa UMA vez no log da corrida (que é privado do
            #     repositório) para quem for testar copiar.
            #
            # Sorteada e não fixa de propósito: senha decidida por pessoa
            # acaba reaproveitada de outro sistema, e senha que vive num
            # secret acaba circulando por mensagem.
            homolog -q -v ON_ERROR_STOP=1 -c "
              UPDATE auth.users
                 SET encrypted_password = crypt(encode(gen_random_bytes(32),'hex'), gen_salt('bf'))
               WHERE email IS NOT NULL;" \
              && echo "Todas as contas receberam senha aleatória (ninguém entra)."

            # A lista chega como 'a@x.com, b@y.com' — vira array do Postgres
            # por string_to_array + trim, sem laço no shell.
            homolog -q -v ON_ERROR_STOP=1 -v lista="$TESTADORES" -f liberar_testadores.sql
            echo "── SENHAS DOS TESTADORES (copie agora; só aparecem aqui) ──"
            homolog -tA -F ' | ' -c "
              SELECT email, senha_provisoria FROM homologacao_testadores_senhas
               ORDER BY email;"
            echo "───────────────────────────────────────────────────────────"
            # A tabela some depois de impressa: senha em claro parada no banco
            # é a mesma exposição que se está tentando evitar.
            homolog -q -c "DROP TABLE IF EXISTS homologacao_testadores_senhas;"

          elif [ -n "$CLIENTE_REAL" ]; then
            # ─────────────────────────────────────────────────────────────
            # UM CLIENTE REAL: três camadas de senha, e a do meio é a que
            # quase escapou.
            #
            #  1. contas do cliente real  -> senha aleatória (ninguém entra),
            #     depois liberadas só para quem está em TESTADORES;
            #  2. SUPERADMINS -> também senha aleatória, mesmo tendo e-mail
            #     mascarado. Superadmin enxerga TODOS os clientes, então uma
            #     conta dessas com a senha compartilhada seria a porta dos
            #     fundos para o dado real — a proteção do item 1 não valeria
            #     nada. Isto não estava no desenho inicial;
            #  3. o resto (contas mascaradas, sem poder de superadmin) ->
            #     senha compartilhada como sempre, porque ali não há dado de
            #     ninguém: são os 1113 clientes embaralhados.
            homolog -q -v ON_ERROR_STOP=1 -v senha="$SENHA_USUARIOS" -c "
              UPDATE auth.users u
                 SET encrypted_password = crypt(:'senha', gen_salt('bf')),
                     email_confirmed_at = COALESCE(u.email_confirmed_at, now())
               WHERE u.email LIKE '%@exemplo.invalid'
                 AND NOT EXISTS (SELECT 1 FROM public.superadmins s
                                  WHERE s.user_id = u.id AND s.ativo)
                 AND NOT EXISTS (SELECT 1 FROM public.user_roles r
                                  WHERE r.user_id = u.id AND r.role::text = 'superadmin')
                 AND NOT EXISTS (SELECT 1 FROM public.profiles p
                                  WHERE p.user_id = u.id
                                    AND p.tenant_id = '$CLIENTE_REAL'::uuid);" \
              && echo "Senha compartilhada aplicada só às contas mascaradas sem poder de superadmin."

            homolog -q -v ON_ERROR_STOP=1 -c "
              UPDATE auth.users u
                 SET encrypted_password = crypt(encode(gen_random_bytes(32),'hex'), gen_salt('bf'))
               WHERE EXISTS (SELECT 1 FROM public.superadmins s
                              WHERE s.user_id = u.id AND s.ativo)
                  OR EXISTS (SELECT 1 FROM public.user_roles r
                              WHERE r.user_id = u.id AND r.role::text = 'superadmin')
                  OR EXISTS (SELECT 1 FROM public.profiles p
                              WHERE p.user_id = u.id
                                AND p.tenant_id = '$CLIENTE_REAL'::uuid);" \
              && echo "Superadmins e contas do cliente real: senha aleatória (ninguém entra)."

            homolog -q -v ON_ERROR_STOP=1 -v lista="$TESTADORES" -f liberar_testadores.sql
            echo "── SENHAS DOS TESTADORES (copie agora; só aparecem aqui) ──"
            homolog -tA -F ' | ' -c "
              SELECT email, senha_provisoria FROM homologacao_testadores_senhas
               ORDER BY email;"
            echo "───────────────────────────────────────────────────────────"
            homolog -q -c "DROP TABLE IF EXISTS homologacao_testadores_senhas;"

          elif [ -n "$SENHA_USUARIOS" ]; then
            homolog -q -v ON_ERROR_STOP=1 -v senha="$SENHA_USUARIOS" \
                    -f aplicar_senha.sql \
              && echo "Senha única aplicada a todos os usuários da homologação."
          else
            echo "::warning::Sem o secret HOMOLOGACAO_SENHA_USUARIOS: ninguém consegue entrar na"
            echo "::warning::homologação (as senhas reais foram invalidadas na leitura, de propósito)."
          fi

          # FORA do if, e isso importa: o login do Supabase exige, além da
          # linha em auth.users, uma IDENTIDADE em auth.identities (provider
          # 'email'). A cópia traz só os usuários — as identidades da produção
          # não vêm, e as antigas caíram no TRUNCATE ... CASCADE. Sem esta
          # inserção, a senha se aplica mas o login recusa, com um erro que
          # não diz nada disso. Vale nos DOIS modos: na primeira versão do
          # modo cru isto ficou dentro do ramo antigo, e o ambiente teria
          # nascido com senha certa e login recusando.
          homolog -q -v ON_ERROR_STOP=1 -c "
            INSERT INTO auth.identities
              (id, user_id, identity_data, provider, provider_id,
               last_sign_in_at, created_at, updated_at)
            SELECT gen_random_uuid(), u.id,
                   jsonb_build_object('sub', u.id::text,
                                      'email', u.email,
                                      'email_verified', true),
                   'email', u.id::text, now(), now(), now()
              FROM auth.users u
             WHERE u.email IS NOT NULL
               AND NOT EXISTS (SELECT 1 FROM auth.identities i
                                WHERE i.user_id = u.id AND i.provider = 'email');" \
            && echo "Identidades de e-mail criadas para os usuários."

      - name: Provar que a cópia é fiel
        env:
          PROD_PASS: ${{ secrets.PRODUCAO_DB_PASSWORD }}
          HOMOLOG_PASS: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
        run: |
          # A esteira tem as duas credenciais na mão — então ela mesma faz a
          # comparação, em vez de imprimir três números e pedir que alguém os
          # confira contra a produção. Conferência que depende de gesto humano
          # é conferência que uma hora não acontece.
          #
          # A medição é a MESMA de docs/script_conferencia_homologacao.sql: uma
          # fonte só, para os dois lados não se afastarem com o tempo.
          medir() {
            PGPASSWORD="$(printf '%s' "$2" | tr -d '\r\n')" \
            psql -h "$3" -p 5432 -U "$4" -d postgres -tA -F'|' \
                 -v ON_ERROR_STOP=1 -f docs/script_conferencia_homologacao.sql \
              | cut -d'|' -f1,2 > "$1"
          }
          medir producao.txt    "$PROD_PASS"    "$HOST_PRODUCAO"    "$PRODUCAO_USER"
          medir homologacao.txt "$HOMOLOG_PASS" "$HOST_HOMOLOGACAO" "$HOMOLOGACAO_USER"

          printf '%-22s %12s %12s   %s\n' MEDIDA PRODUCAO HOMOLOGACAO SITUACAO
          divergiu=0
          while IFS='|' read -r item valor_prod; do
            valor_homolog=$(awk -F'|' -v i="$item" '$1==i{print $2}' homologacao.txt)
            case "$item" in
              # Índice inválido o pg_dump não copia — é o único caso em que
              # diferença é esperada, e ela se explica pela linha de cima.
              #
              # As permissões SAÍRAM desta lista: agora são copiadas, então
              # passaram a ser conferidas como todo o resto. Enquanto eram
              # "diferença esperada", um 0 aqui parecia normal — e era o que
              # deixava a homologação ilegível sem que nada reclamasse.
              'indices invalidos') situacao='diferenca esperada' ;;
              *) if [ "$valor_prod" = "$valor_homolog" ]; then situacao='ok'
                 else situacao='DIVERGIU'; divergiu=1; fi ;;
            esac
            printf '%-22s %12s %12s   %s\n' "$item" "$valor_prod" "${valor_homolog:-?}" "$situacao"
          done < producao.txt

          echo
          if [ "$divergiu" -eq 1 ]; then
            echo "::error::A homologação NÃO é cópia fiel da produção. Veja acima qual medida divergiu"
            echo "::error::e as mensagens de erro do passo anterior — é lá que está o objeto que faltou."
            exit 1
          fi
          echo "A homologação é cópia fiel da produção."
          echo "Igualdade aqui é sucesso — ela existe para ser espelho, defeitos e tudo."

      - name: Apontar as rotinas do banco para o PRÓPRIO ambiente (app_config)
        env:
          HOMOLOG_PASS: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
        run: |
          # A cópia chega com app_config embaralhada — e isso é a proteção de
          # ambiente funcionando: rotina de disparo sem valores não chama
          # ninguém, muito menos a produção. Mas com as Edge Functions
          # publicadas AQUI (passo seguinte), o ensaio fica mais fiel se as
          # rotinas apontarem para o PRÓPRIO ambiente.
          #
          # Os dois valores são públicos por desenho (URL + chave anon) e vêm
          # do .env.homologacao — a MESMA fonte que o site usa. Uma fonte só:
          # valor copiado à mão aqui seria a próxima divergência esperando
          # data para acontecer.
          URL=$(grep -E '^VITE_SUPABASE_URL=' .env.homologacao | cut -d'"' -f2)
          ANON=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env.homologacao | cut -d'"' -f2)
          case "$URL" in
            *"$PRODUCAO_REF"*)
              echo "::error::.env.homologacao aponta para a PRODUCAO — abortando."; exit 1 ;;
            *"$HOMOLOGACAO_REF"*) : ;;
            *)
              echo "::error::.env.homologacao nao aponta para a homologacao — abortando."; exit 1 ;;
          esac
          export PGPASSWORD="$(printf '%s' "$HOMOLOG_PASS" | tr -d '\r\n')"
          homolog() { psql -h "$HOST_HOMOLOGACAO" -p 5432 -U "$HOMOLOGACAO_USER" -d postgres "$@"; }
          # Pela entrada padrão (não -c): é onde o psql substitui :'var'.
          homolog -q -v ON_ERROR_STOP=1 -v url="$URL" -v anon="$ANON" <<'FIM_SQL'
          -- Só as duas chaves de ambiente. As github_dispatch_* ficam DE FORA
          -- de propósito: agendamento disparando esteira a partir daqui é
          -- decisão ainda não tomada — sem valores, fica "salvo mas nada é
          -- disparado", que é o comportamento seguro.
          INSERT INTO public.app_config (chave, valor)
          VALUES ('supabase_url', :'url'), ('supabase_anon_key', :'anon')
          ON CONFLICT (chave) DO UPDATE
            SET valor = EXCLUDED.valor, atualizado_em = now();
          FIM_SQL
          echo "app_config: supabase_url e supabase_anon_key apontam para a homologacao."

      - uses: supabase/setup-cli@v1
        with:
          # Versão FIXA, mesmo motivo da esteira do staging: "latest" consulta
          # o GitHub sem autenticação a cada corrida e estoura o rate limit.
          version: 2.113.0
      - name: Publicar as Edge Functions na homologação
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # A CLI lê esta variável no `link` (o config.toml traz o project_id
          # da produção; o link + --project-ref garantem o alvo certo).
          SUPABASE_DB_PASSWORD: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
        run: |
          # Sem functions, a homologação era um ensaio incompleto: convite,
          # ativação de conta, IA e o painel de QA (aba Cypress) não tinham
          # para quem ligar. Publica as mesmas functions do repositório —
          # as chaves de plataforma (SUPABASE_URL, SERVICE_ROLE, ANON) o
          # próprio Supabase injeta; chaves de recurso (OPENAI_API_KEY,
          # RESEND_API_KEY...) são segredos do projeto, configurados no
          # painel de quem decidir usá-los aqui.
          #
          # Roda nos DOIS modos: o so_finalizar (~min) é também o jeito
          # barato de atualizar functions sem refazer a cópia de ~40min.
          if [ "$HOMOLOGACAO_REF" = "$PRODUCAO_REF" ]; then
            echo "::error::O alvo das functions aponta para a producao — abortando."; exit 1
          fi
          # Mesmo padrão já provado na esteira do staging: link + deploy.
          supabase link --project-ref "$HOMOLOGACAO_REF"
          # O empacotamento baixa dependências de CDNs públicos que às vezes
          # falham momentaneamente (522/timeout) — tenta até 3 vezes.
          for i in 1 2 3; do
            if supabase functions deploy --project-ref "$HOMOLOGACAO_REF"; then
              echo "Functions publicadas na homologacao."
              exit 0
            fi
            echo "Tentativa $i falhou; aguardando 30s antes de tentar de novo..."
            sleep 30
          done
          echo "::error::Functions deploy falhou após 3 tentativas."
          exit 1

      - name: Guardar o retrato e o log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-estrutura
          path: |
            estrutura_producao.sql
            restauracao.log
          retention-days: 7
