# =====================================================================
# Homologação — trazer UM cliente com dados reais, sem refazer a cópia
#
# O botão RECRIAR resolve o mesmo problema demolindo: apaga a homologação
# inteira e reconstrói em ~40 minutos. Quem tem ensaio em andamento ou
# cadastro de teste lá dentro perde tudo. Esta esteira é o reparo no lugar
# da demolição: mexe SÓ nas linhas do cliente pedido, em poucos minutos, e
# não encosta no resto do ambiente.
#
# O QUE TORNA ISSO POSSÍVEL: as chaves nunca são embaralhadas (a máscara só
# toca texto, json e listas). Então cada linha da homologação sabe qual
# linha da produção é a dela, e um UPDATE ... FROM casa as duas pontas.
#
# O QUE ELA NÃO FAZ: não INSERE linhas novas. Registro criado na produção
# depois da última cópia não existe aqui, e criá-lo exigiria respeitar a
# ordem das 627 chaves estrangeiras — o problema que a cópia completa
# resolve derrubando todas elas. Em vez de inserir em silêncio, ela CONTA
# quantas linhas não acharam par e imprime o número. Número alto = hora de
# rodar o RECRIAR completo.
#
# A PRODUÇÃO NUNCA É ALTERADA: a credencial usada nela é o usuário
# homologacao_leitor_v2, criado com pg_read_all_data e sem permissão de
# escrita. Se esta esteira tentasse escrever lá, o banco recusaria.
#
# Secrets: PRODUCAO_DB_PASSWORD, HOMOLOGACAO_DB_PASSWORD,
#          HOMOLOGACAO_TESTADORES (obrigatório — ver o passo da trava)
# =====================================================================
name: homologacao-sincronizar-cliente

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite SINCRONIZAR para confirmar'
        required: true
        default: ''
      cliente_real:
        description: 'tenant_id (uuid) do cliente que virá com dados REAIS'
        required: true
        default: ''
      host_producao:
        description: 'Host do Session pooler da PRODUÇÃO'
        required: false
        default: 'aws-1-sa-east-1.pooler.supabase.com'
      host_homologacao:
        description: 'Host do Session pooler da HOMOLOGAÇÃO'
        required: true
        default: ''

jobs:
  sincronizar:
    name: Sincronizar um cliente com dados reais
    runs-on: ubuntu-latest
    concurrency:
      group: homologacao
      cancel-in-progress: false
    env:
      PRODUCAO_REF: diayjpsrcerycycyaxst
      HOMOLOGACAO_REF: fgsblefvdabgdouipigz
      PRODUCAO_USER: homologacao_leitor_v2.diayjpsrcerycycyaxst
      HOMOLOGACAO_USER: postgres.fgsblefvdabgdouipigz
      HOST_PRODUCAO_DIGITADO: ${{ github.event.inputs.host_producao }}
      HOST_HOMOLOGACAO_DIGITADO: ${{ github.event.inputs.host_homologacao }}
      CLIENTE_DIGITADO: ${{ github.event.inputs.cliente_real }}
    steps:
      - uses: actions/checkout@v4

      - name: Exigir a confirmação e conferir o que foi informado
        run: |
          if [ "${{ github.event.inputs.confirmar }}" != "SINCRONIZAR" ]; then
            echo "::error::Digite SINCRONIZAR no campo de confirmação."; exit 1
          fi
          # Mesma limpeza da esteira do RECRIAR: quem cola do painel traz
          # junto o usuário, a porta ou a URL inteira. Recusar com a sobra
          # na mensagem é mais útil que tentar conectar e falhar por "host
          # desconhecido", que manda procurar no lugar errado.
          limpar() {
            LIMPO=$(printf '%s' "$1" | tr -d '[:space:]')
            LIMPO=${LIMPO#*@}
            LIMPO=${LIMPO%%:*}
            LIMPO=${LIMPO%%/*}
          }
          limpar "$HOST_PRODUCAO_DIGITADO";   HP="$LIMPO"
          limpar "$HOST_HOMOLOGACAO_DIGITADO"; HH="$LIMPO"
          for par in "producao:$HP" "homologacao:$HH"; do
            nome=${par%%:*}; valor=${par#*:}
            case "$valor" in
              ''|*' '*) echo "::error::Host de $nome vazio ou inválido."; exit 1 ;;
              *.pooler.supabase.com) : ;;
              *) echo "::error::Host de $nome não termina em .pooler.supabase.com: $valor"
                 echo "::error::Use o Session pooler; a conexão direta só atende IPv6."; exit 1 ;;
            esac
          done
          CLI=$(printf '%s' "$CLIENTE_DIGITADO" | tr -d '[:space:]')
          case "$CLI" in
            ????????-????-????-????-????????????) : ;;
            *) echo "::error::cliente_real precisa ser um uuid. Recebido: '$CLI'"; exit 1 ;;
          esac
          {
            echo "HOST_PRODUCAO=$HP"
            echo "HOST_HOMOLOGACAO=$HH"
            echo "CLIENTE=$CLI"
          } >> "$GITHUB_ENV"
          echo "Produção (leitura):  $HP"
          echo "Homologação (escrita): $HH"
          echo "Cliente que virá real: $CLI"

      - name: Conferir que o destino NÃO é a produção
        run: |
          # O destino recebe UPDATE com dado cru. Se algum dia alguém trocar
          # o usuário de destino pelo da produção, isto impede o desastre.
          case "$HOMOLOGACAO_USER$HOST_HOMOLOGACAO" in
            *"$PRODUCAO_REF"*)
              echo "::error::O destino aponta para a PRODUÇÃO. Abortando."; exit 1 ;;
          esac
          case "$HOMOLOGACAO_USER" in
            *"$HOMOLOGACAO_REF"*) echo "Destino confere: homologação." ;;
            *) echo "::error::O destino não é o projeto de homologação. Abortando."; exit 1 ;;
          esac

      - name: Exigir a lista de testadores
        env:
          TESTADORES: ${{ secrets.HOMOLOGACAO_TESTADORES }}
        run: |
          # Depois desta corrida a homologação terá e-mails REAIS deste
          # cliente. Sem senha individual, a senha compartilhada valeria
          # para eles — e aí qualquer pessoa que soubesse um e-mail entraria
          # e leria CPF e atestado reais. A lista é o que separa "ambiente
          # fechado" de "página aberta com dado de gente".
          if [ -z "$TESTADORES" ]; then
            echo "::error::O secret HOMOLOGACAO_TESTADORES está vazio."
            echo "::error::Cadastre os e-mails REAIS de quem vai testar, separados por"
            echo "::error::vírgula, e rode de novo. Sem ele esta esteira não roda."
            exit 1
          fi
          echo "Testadores configurados: $(printf '%s' "$TESTADORES" | tr ',' '\n' | grep -c .)"

      - name: Instalar as ferramentas do PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Sincronizar as linhas do cliente
        env:
          PROD_PASS: ${{ secrets.PRODUCAO_DB_PASSWORD }}
          HOMOLOG_PASS: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
        run: |
          prod() {
            PGPASSWORD="$(printf '%s' "$PROD_PASS" | tr -d '\r\n')" \
            psql -h "$HOST_PRODUCAO" -p 5432 -U "$PRODUCAO_USER" -d postgres "$@"
          }
          homolog() {
            PGPASSWORD="$(printf '%s' "$HOMOLOG_PASS" | tr -d '\r\n')" \
            psql -h "$HOST_HOMOLOGACAO" -p 5432 -U "$HOMOLOGACAO_USER" -d postgres "$@"
          }

          echo "== Lendo estrutura e chaves da produção (somente leitura)"
          prod -tA -v ON_ERROR_STOP=1 -f scripts/homologacao/catalogo_colunas.sql > catalogo.tsv
          prod -tA -v ON_ERROR_STOP=1 -f scripts/homologacao/catalogo_chaves.sql  > chaves.tsv
          python3 scripts/homologacao/gerar_sincronia_cliente.py \
            catalogo.tsv chaves.tsv "$CLIENTE" > plano.tsv
          echo "Tabelas no plano: $(wc -l < plano.tsv)"

          # Área de pouso: as linhas vindas da produção aterrissam aqui antes
          # de tocar nas tabelas de verdade. Schema separado para que uma
          # falha no meio não deixe lixo espalhado pelo public — e para que o
          # DROP no fim leve tudo de uma vez.
          homolog -q -v ON_ERROR_STOP=1 -c \
            'DROP SCHEMA IF EXISTS sinc_cliente CASCADE; CREATE SCHEMA sinc_cliente;'

          # Gatilhos desligados durante a sincronia, pelo mesmo motivo da
          # cópia completa: os de auditoria gravariam um histórico que nunca
          # aconteceu, e os de "atualizado_em" reescreveriam as datas — que
          # são justamente o dado que dá realismo ao ensaio.
          echo "== Desligando gatilhos"
          homolog -tAc "SELECT format('ALTER TABLE %s DISABLE TRIGGER USER;', c.oid::regclass)
                          FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                         WHERE n.nspname='public' AND c.relkind='r';" > desligar.sql
          homolog -q -f desligar.sql

          total_atualizadas=0; total_sem_par=0; falhas=0; tabelas_ok=0
          while IFS=$'\t' read -r tabela chave colunas cond; do
            [ -z "$tabela" ] && continue
            nome_curto=$(printf '%s' "$tabela" | tr -d '"' | tr '.' '_')
            pouso="sinc_cliente.$nome_curto"

            # 1) molde vazio com a mesma estrutura da tabela de destino
            if ! homolog -q -v ON_ERROR_STOP=1 \
                 -c "CREATE TABLE $pouso (LIKE $tabela);" 2>erro.txt; then
              falhas=$((falhas+1)); echo "  FALHOU (molde): $tabela"
              sed 's/^/      /' erro.txt | head -2; continue
            fi

            # 2) as linhas do cliente, CRUAS, da produção para o pouso
            if ! prod -qAt -c "COPY (SELECT $chave, $colunas FROM $tabela WHERE $cond) TO STDOUT" \
                 | homolog -q -c "COPY $pouso ($chave, $colunas) FROM STDIN" 2>erro.txt; then
              falhas=$((falhas+1)); echo "  FALHOU (copia): $tabela"
              sed 's/^/      /' erro.txt | head -2; continue
            fi

            # 3) atualizar SÓ as linhas que já existem, casando pela chave
            sets=$(printf '%s' "$colunas" | sed "s/\([^,]*\)/\1 = p.\1/g")
            n=$(homolog -tAc "
              WITH atualizadas AS (
                UPDATE $tabela d SET $sets FROM $pouso p
                 WHERE d.$chave = p.$chave RETURNING 1)
              SELECT count(*) FROM atualizadas;" 2>erro.txt) || {
              falhas=$((falhas+1)); echo "  FALHOU (update): $tabela"
              sed 's/^/      /' erro.txt | head -3
              # Colisão de chave única é o caso comum, e o erro sozinho não
              # diz o que fazer. Mostrar a linha JÁ EXISTENTE que está no
              # caminho transforma "duplicate key" em uma instrução: é esta
              # linha aqui que precisa sair.
              # Colisão de chave única é o caso comum aqui, e o erro sozinho
              # não diz o que fazer. Em vez de tentar montar e RODAR uma
              # consulta a partir do texto do erro — que exigiria adivinhar
              # aspas e tipos de cada valor —, imprime a consulta pronta para
              # a pessoa colar. Menos esperto, e não erra.
              if grep -q 'duplicate key' erro.txt; then
                echo "      -> Uma linha da homologação já ocupa essa chave."
                echo "         Provável cadastro feito durante os testes. Para achar e"
                echo "         decidir, cole no SQL Editor da HOMOLOGAÇÃO:"
                echo "           SELECT * FROM $tabela WHERE <a chave do DETAIL acima>;"
                echo "         Apagada a linha conflitante, rode esta esteira de novo."
              fi
              continue; }

            # 4) quantas vieram da produção e não acharam par aqui
            sem_par=$(homolog -tAc "
              SELECT count(*) FROM $pouso p
               WHERE NOT EXISTS (SELECT 1 FROM $tabela d WHERE d.$chave = p.$chave);" \
              2>/dev/null || echo 0)

            total_atualizadas=$((total_atualizadas + ${n:-0}))
            total_sem_par=$((total_sem_par + ${sem_par:-0}))
            tabelas_ok=$((tabelas_ok+1))
            if [ "${n:-0}" -gt 0 ] || [ "${sem_par:-0}" -gt 0 ]; then
              printf '  %-45s %6s atualizadas  %4s sem par\n' "$tabela" "${n:-0}" "${sem_par:-0}"
            fi
          done < plano.tsv

          echo "== Religando gatilhos"
          homolog -tAc "SELECT format('ALTER TABLE %s ENABLE TRIGGER USER;', c.oid::regclass)
                          FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                         WHERE n.nspname='public' AND c.relkind='r';" > religar.sql
          homolog -q -f religar.sql
          homolog -q -c 'DROP SCHEMA IF EXISTS sinc_cliente CASCADE;'

          echo
          echo "Tabelas processadas: $tabelas_ok de $(wc -l < plano.tsv)"
          echo "Linhas atualizadas:  $total_atualizadas"
          echo "Linhas sem par:      $total_sem_par"
          {
            echo "TOTAL_SEM_PAR=$total_sem_par"
            echo "FALHAS=$falhas"
          } >> "$GITHUB_ENV"

          # NÃO aborta aqui, e isso foi aprendido a caro preço na corrida #1:
          # uma tabela falhou (colisão de chave única em ponto_fechamentos),
          # o passo saiu com erro, e os passos seguintes foram PULADOS — entre
          # eles o que troca as senhas. O ambiente ficou com o dado real
          # dentro e a senha compartilhada ainda valendo, que é exatamente o
          # buraco que este workflow existe para fechar.
          #
          # Falhar tarde é melhor que falhar cedo quando o "cedo" deixa a
          # porta aberta. A corrida ainda vai ficar VERMELHA — mas só depois
          # de o ambiente estar num estado seguro.
          if [ "$falhas" -gt 0 ]; then
            echo "::warning::$falhas tabela(s) falharam na sincronia (veja acima)."
            echo "::warning::A corrida vai reprovar no fim — mas antes disso as senhas"
            echo "::warning::serão ajustadas, para o ambiente não ficar aberto com dado real."
          fi

      - name: Ajustar as contas de login do cliente
        # always(): este passo é a TRAVA DE SEGURANÇA do ambiente — é ele que
        # tira a senha compartilhada das contas que agora têm dado real. Se
        # ele for pulado porque algo antes falhou, o resultado é o pior dos
        # mundos: dado real dentro e porta aberta. Aconteceu na corrida #1.
        if: always()
        env:
          PROD_PASS: ${{ secrets.PRODUCAO_DB_PASSWORD }}
          HOMOLOG_PASS: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
          TESTADORES: ${{ secrets.HOMOLOGACAO_TESTADORES }}
        run: |
          # auth.users fica FORA do laço anterior de propósito: mexer no
          # e-mail sem, na mesma passada, acertar a identidade (cujo
          # identity_data guarda o e-mail) deixa o login num estado que não
          # dá erro claro — a homologação já passou uma corrida inteira
          # aceitando a senha e devolvendo para a tela de entrada.
          prod() {
            PGPASSWORD="$(printf '%s' "$PROD_PASS" | tr -d '\r\n')" \
            psql -h "$HOST_PRODUCAO" -p 5432 -U "$PRODUCAO_USER" -d postgres "$@"
          }
          homolog() {
            PGPASSWORD="$(printf '%s' "$HOMOLOG_PASS" | tr -d '\r\n')" \
            psql -h "$HOST_HOMOLOGACAO" -p 5432 -U "$HOMOLOGACAO_USER" -d postgres "$@"
          }

          echo "== Trazendo os e-mails reais das contas deste cliente e dos testadores"
          homolog -q -v ON_ERROR_STOP=1 -c \
            'DROP TABLE IF EXISTS sinc_emails;
             CREATE TABLE sinc_emails (id uuid PRIMARY KEY, email text);'

          # DOIS conjuntos, e o segundo faltava:
          #
          #  1. as contas do cliente sincronizado — para o ensaio ter as
          #     pessoas certas;
          #  2. as contas de QUEM VAI TESTAR, mesmo que pertençam a outro
          #     cliente ou não tenham vínculo nenhum (superadmin costuma não
          #     ter). Sem isso o e-mail do testador continua embaralhado, e
          #     não se pode entrar com um e-mail que não existe: a corrida #2
          #     avisou "Testadores sem conta na base" para três dos quatro
          #     nomes da lista, e eram justamente os que precisavam entrar.
          #
          # Restaurar o e-mail de um testador não amplia a exposição: é o
          # e-mail da própria pessoa, colocada na lista de propósito, e ela
          # recebe senha individual sorteada. Nenhum dado de OUTRO cliente
          # deixa de ser mascarado por causa disso — só o endereço de login.
          cat > buscar_emails.sql <<'FIM_SQL'
          COPY (
            SELECT u.id, u.email
              FROM auth.users u
             WHERE u.id IN (SELECT user_id FROM public.profiles
                             WHERE tenant_id = :'cliente'::uuid)
                OR lower(u.email) IN (
                     SELECT lower(btrim(e))
                       FROM unnest(string_to_array(:'lista', ',')) e
                      WHERE btrim(e) <> '')
          ) TO STDOUT
          FIM_SQL
          prod -qAt -v cliente="$CLIENTE" -v lista="$TESTADORES" -f buscar_emails.sql \
            | homolog -q -c "COPY sinc_emails (id, email) FROM STDIN"

          n=$(homolog -tAc "
            WITH m AS (
              UPDATE auth.users u SET email = s.email
                FROM sinc_emails s WHERE u.id = s.id RETURNING 1)
            SELECT count(*) FROM m;")
          echo "Contas com e-mail real restaurado: $n"

          # A identidade acompanha o e-mail, senão o login recusa.
          homolog -q -v ON_ERROR_STOP=1 -c "
            UPDATE auth.identities i
               SET identity_data = jsonb_set(i.identity_data, '{email}', to_jsonb(s.email))
              FROM sinc_emails s
             WHERE i.user_id = s.id AND i.provider = 'email';"
          echo "Identidades acertadas."

          # Senha: aleatória para todas as contas reais e para os
          # superadmins, depois utilizável só para os testadores.
          # Superadmin entra na conta mesmo tendo e-mail mascarado — ele
          # enxerga TODOS os clientes, inclusive este, então uma conta
          # dessas com a senha compartilhada seria a porta dos fundos.
          homolog -q -v ON_ERROR_STOP=1 -c "
            UPDATE auth.users u
               SET encrypted_password = crypt(encode(gen_random_bytes(32),'hex'), gen_salt('bf'))
             WHERE u.id IN (SELECT id FROM sinc_emails)
                OR EXISTS (SELECT 1 FROM public.superadmins s
                            WHERE s.user_id = u.id AND s.ativo)
                OR EXISTS (SELECT 1 FROM public.user_roles r
                            WHERE r.user_id = u.id AND r.role::text = 'superadmin');"
          echo "Contas reais e superadmins: senha aleatória (ninguém entra)."

          cat > liberar_testadores.sql <<'FIM_SQL'
          DROP TABLE IF EXISTS homologacao_testadores_senhas;
          CREATE TABLE homologacao_testadores_senhas (
            email text PRIMARY KEY, senha_provisoria text NOT NULL);
          WITH pedidos AS (
            SELECT lower(btrim(e)) AS email
              FROM unnest(string_to_array(:'lista', ',')) e
             WHERE btrim(e) <> ''
          ), sorteio AS (
            SELECT p.email, encode(gen_random_bytes(12), 'hex') AS senha
              FROM pedidos p
             WHERE EXISTS (SELECT 1 FROM auth.users u WHERE lower(u.email) = p.email)
          ), gravar AS (
            INSERT INTO homologacao_testadores_senhas (email, senha_provisoria)
            SELECT email, senha FROM sorteio RETURNING email, senha_provisoria
          )
          UPDATE auth.users u
             SET encrypted_password = crypt(g.senha_provisoria, gen_salt('bf')),
                 email_confirmed_at = COALESCE(u.email_confirmed_at, now())
            FROM gravar g
           WHERE lower(u.email) = g.email;
          -- A lista entra por set_config, e não por :'lista' dentro do
          -- bloco: o psql não substitui variável dentro de aspas-dólar.
          SELECT set_config('homologacao.lista_testadores', :'lista', false);
          DO $aviso$
          DECLARE faltou text;
          BEGIN
            SELECT string_agg(btrim(e), ', ') INTO faltou
              FROM unnest(string_to_array(
                     current_setting('homologacao.lista_testadores'), ',')) e
             WHERE btrim(e) <> ''
               AND NOT EXISTS (SELECT 1 FROM auth.users u
                                WHERE lower(u.email) = lower(btrim(e)));
            IF faltou IS NOT NULL THEN
              RAISE WARNING 'Testadores sem conta na base: %', faltou;
            END IF;
          END $aviso$;
          FIM_SQL
          homolog -q -v ON_ERROR_STOP=1 -v lista="$TESTADORES" -f liberar_testadores.sql

          echo "── SENHAS DOS TESTADORES (copie agora; só aparecem aqui) ──"
          # O alcance vai junto da senha, e não é detalhe: uma conta de
          # superadmin enxerga TODOS os clientes, não só o sincronizado.
          # Entregar a senha sem dizer isso deixaria a pessoa achando que
          # está num recorte quando está no todo.
          homolog -tA -F ' | ' -c "
            SELECT s.email, s.senha_provisoria,
                   CASE WHEN EXISTS (SELECT 1 FROM public.superadmins sa
                                      JOIN auth.users u ON u.id = sa.user_id
                                     WHERE lower(u.email) = s.email AND sa.ativo)
                          OR EXISTS (SELECT 1 FROM public.user_roles r
                                      JOIN auth.users u ON u.id = r.user_id
                                     WHERE lower(u.email) = s.email
                                       AND r.role::text = 'superadmin')
                        THEN 'SUPERADMIN - enxerga todos os clientes'
                        ELSE 'acesso normal' END
              FROM homologacao_testadores_senhas s ORDER BY s.email;"
          echo "───────────────────────────────────────────────────────────"
          homolog -q -c "DROP TABLE IF EXISTS homologacao_testadores_senhas;
                         DROP TABLE IF EXISTS sinc_emails;"

      - name: Conferir o resultado
        if: always()
        env:
          HOMOLOG_PASS: ${{ secrets.HOMOLOGACAO_DB_PASSWORD }}
          PROD_PASS: ${{ secrets.PRODUCAO_DB_PASSWORD }}
        run: |
          homolog() {
            PGPASSWORD="$(printf '%s' "$HOMOLOG_PASS" | tr -d '\r\n')" \
            psql -h "$HOST_HOMOLOGACAO" -p 5432 -U "$HOMOLOGACAO_USER" -d postgres "$@"
          }
          prod() {
            PGPASSWORD="$(printf '%s' "$PROD_PASS" | tr -d '\r\n')" \
            psql -h "$HOST_PRODUCAO" -p 5432 -U "$PRODUCAO_USER" -d postgres "$@"
          }
          # Heredoc no nível EXTERNO, nunca dentro do if que o usa. O
          # marcador de fim precisa começar na coluna zero depois que o YAML
          # tira a indentação comum; dentro do if ele sai indentado, o bash
          # não o reconhece e engole o resto do passo para dentro do arquivo,
          # em silêncio. Já aconteceu no #314, e voltou a acontecer aqui —
          # o bash -n pegou antes de subir.
          cat > existe_na_producao.sql <<'FIM_SQL'
          SELECT count(*) FROM public.empresa_cadastro
           WHERE id = ANY (string_to_array(:'ids', ',')::uuid[]);
          FIM_SQL

          echo "== Empresas do cliente sincronizado"
          homolog -c "SELECT razao_social, cnpj, cidade, estado
                        FROM public.empresa_cadastro
                       WHERE tenant_id = '$CLIENTE'::uuid
                       ORDER BY razao_social;"

          # A prova de que o resto ficou intocado: fora deste cliente, todo
          # nome de empresa preenchido tem de continuar começando com anon-.
          #
          # DUAS EXCEÇÕES LEGÍTIMAS, e a primeira versão desta conferência não
          # conhecia nenhuma delas — reprovou a corrida #2 acusando "3
          # empresas sem máscara" que eram exatamente o que deviam ser:
          #
          #  · os CERCADOS de QA ('[QA] Empresa Alfa/Beta'), preservados de
          #    propósito pela máscara, senão o motor de testes não acha o
          #    cercado e a bateria aborta;
          #  · empresas CADASTRADAS na própria homologação durante os testes:
          #    nasceram aqui, nunca passaram por máscara nenhuma, e não têm
          #    como "estar mascaradas".
          #
          # Contar sem listar foi o erro de fundo: um número sozinho não deixa
          # ninguém julgar se é vazamento ou é o esperado. Agora lista.
          echo "== Empresas fora do cliente cujo nome não está mascarado"
          homolog -c "
            SELECT t.nome AS cliente, ec.razao_social, ec.created_at::date AS criada_em,
                   CASE WHEN t.slug IN ('qa-sandbox','qa-sandbox-2')
                          THEN 'cercado de QA (esperado)'
                        ELSE 'INVESTIGAR' END AS veredito
              FROM public.empresa_cadastro ec
              JOIN public.tenants t ON t.id = ec.tenant_id
             WHERE ec.tenant_id <> '$CLIENTE'::uuid
               AND ec.razao_social IS NOT NULL AND ec.razao_social <> ''
               AND ec.razao_social NOT LIKE 'anon-%'
             ORDER BY 4 DESC, 1;"

          # DECIDIR EM VEZ DE PEDIR PARA ALGUÉM DECIDIR.
          #
          # A versão anterior listava as suspeitas e mandava a pessoa julgar
          # pela data e pelo nome. Funcionava, mas reprovava a corrida toda
          # vez que alguém tivesse cadastrado uma empresa de teste na
          # homologação — e "vermelho que quase sempre é falso" é vermelho
          # que ninguém olha mais.
          #
          # Existe uma pergunta que separa os dois casos sem chute: ESTA
          # LINHA EXISTE NA PRODUÇÃO? O id nunca é embaralhado, então:
          #   · existe lá  -> veio da cópia e devia estar mascarada = VAZOU;
          #   · não existe -> nasceu aqui dentro = cadastro de teste.
          homolog -tAc "
            SELECT ec.id FROM public.empresa_cadastro ec
              JOIN public.tenants t ON t.id = ec.tenant_id
             WHERE ec.tenant_id <> '$CLIENTE'::uuid
               AND t.slug NOT IN ('qa-sandbox','qa-sandbox-2')
               AND ec.razao_social IS NOT NULL AND ec.razao_social <> ''
               AND ec.razao_social NOT LIKE 'anon-%';" > suspeitas.txt

          suspeitas=$(grep -c . suspeitas.txt || true)
          if [ "${suspeitas:-0}" -eq 0 ]; then
            echo "Nenhuma empresa sem máscara fora do cliente e dos cercados de QA."
          else
            echo "Suspeitas a esclarecer com a produção: $suspeitas"
            ids=$(paste -sd, suspeitas.txt)
            vazou=$(prod -tAq -v ids="$ids" -f existe_na_producao.sql | tr -d '[:space:]')
            nascidas_aqui=$((suspeitas - ${vazou:-0}))
            echo "  nasceram na homologação (cadastro de teste): $nascidas_aqui"
            echo "  vieram da produção sem máscara (VAZAMENTO):   ${vazou:-?}"
            if [ "${vazou:-1}" -ne 0 ]; then
              echo "::error::$vazou empresa(s) vieram da produção e NÃO estão mascaradas."
              echo "::error::Isso é vazamento de verdade: a máscara falhou para um cliente"
              echo "::error::que não era o alvo. NÃO use este ambiente — refaça a cópia"
              echo "::error::completa (botão RECRIAR) e me avise."
              exit 1
            fi
            echo "Nenhuma delas existe na produção: são cadastros feitos aqui, não vazamento."
          fi

          if [ "${TOTAL_SEM_PAR:-0}" -gt 0 ]; then
            echo "::warning::$TOTAL_SEM_PAR linha(s) existem na produção e não na homologação."
            echo "::warning::São registros criados depois da última cópia completa. Esta esteira"
            echo "::warning::não insere linhas novas — se o número for relevante, rode o botão"
            echo "::warning::RECRIAR no modo completo com mascarar=um_cliente."
          fi
          echo "Sincronia concluída. O restante da homologação não foi tocado."

          # A reprovação vem AQUI, no fim, e não no passo da cópia: assim as
          # senhas já foram ajustadas e o ambiente está fechado antes de a
          # corrida ficar vermelha. Vermelho continua sendo vermelho — só
          # deixou de custar uma porta aberta.
          if [ "${FALHAS:-0}" -gt 0 ]; then
            echo "::error::$FALHAS tabela(s) não sincronizaram — veja o passo da cópia."
            echo "::error::As senhas JÁ foram ajustadas: o ambiente está fechado."
            echo "::error::Causa mais comum: colisão de chave única, quando a homologação"
            echo "::error::já tem uma linha com o valor real que a produção está devolvendo"
            echo "::error::(um registro criado aí dentro durante os testes). Apague a linha"
            echo "::error::conflitante na homologação e rode de novo, ou use o RECRIAR completo."
            exit 1
          fi
