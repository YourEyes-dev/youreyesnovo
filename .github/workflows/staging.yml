# =====================================================================
# Staging automático — YourEyes
#
# A cada mudança mesclada na main:
#   1) aplica as migrations novas no projeto Supabase de STAGING
#      (bmehdgthciuvdbvutsdv — nunca na produção, que não é gerida
#      por CLI) e reimplanta as Edge Functions;
#   2) publica o SITE DE TESTE (build com .env.staging) no GitHub
#      Pages do próprio repositório — sem contas nem secrets extras:
#      https://youreyes-dev.github.io/youreyesnovo/teste/
#      (a raiz .../youreyesnovo/ redireciona para /teste/; a homologação
#       fica em .../youreyesnovo/homologacao/)
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   senha do banco do projeto de staging
# =====================================================================
name: staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  banco:
    name: Migrations e functions no staging
    runs-on: ubuntu-latest
    # Serializa SÓ o deploy de banco — dois `db push` nunca rodam concorrentes
    # (era o motivo da concorrência) —, sem que o job de testes de tela (`telas`,
    # lento e às vezes vermelho por conta própria) segure a fila das próximas
    # entregas. Antes a trava era no nível do WORKFLOW: a corrida inteira só
    # "terminava" quando o Cypress terminava, e a leva seguinte ficava presa
    # (pending) atrás dele. Agora a próxima corrida começa na hora; apenas o
    # passo de banco espera o banco anterior — o Cypress roda ao lado, sem travar.
    concurrency:
      group: staging-banco
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STAGING_REF: bmehdgthciuvdbvutsdv
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Versão FIXA (não "latest"): com "latest" a esteira pergunta ao
          # GitHub "qual a release mais nova?" a cada corrida, e essa consulta
          # (sem autenticação) estoura o limite compartilhado do GitHub
          # ("rate limit exceeded"), derrubando a corrida logo no 1º passo.
          # Fixando a versão, ela baixa direto, sem essa consulta. Para subir
          # a ferramenta um dia, basta trocar este número por outro publicado.
          version: 2.113.0
      - name: Conferir que o alvo é o staging
        run: |
          if [ "$STAGING_REF" = "diayjpsrcerycycyaxst" ]; then
            echo "::error::Alvo aponta para a producao — abortando."; exit 1
          fi
      - name: Conferir que nao ha carimbo de migration repetido
        # Duas migrations com o mesmo carimbo quebram o db push com um erro de
        # chave duplicada que nao diz QUAIS arquivos colidiram — e a esteira
        # fica vermelha para todo mundo ate alguem descobrir. Esta conferencia
        # falha antes, dizendo os nomes.
        run: node scripts/verificar-carimbos.mjs

      - name: Aplicar migrations
        run: |
          supabase link --project-ref "$STAGING_REF"
          supabase db push --include-all
      - name: Reimplantar Edge Functions
        # O empacotamento baixa dependências de CDNs públicos que às vezes
        # falham momentaneamente (522/timeout) — tenta até 3 vezes.
        run: |
          for i in 1 2 3; do
            if supabase functions deploy --project-ref "$STAGING_REF"; then
              exit 0
            fi
            echo "Tentativa $i falhou; aguardando 30s antes de tentar de novo..."
            sleep 30
          done
          echo "::error::Functions deploy falhou após 3 tentativas."
          exit 1

  site:
    name: Site de teste (GitHub Pages)
    needs: banco
    runs-on: ubuntu-latest
    env:
      # O NOME DO REPOSITÓRIO VEM DO PRÓPRIO GITHUB, e não escrito à mão.
      #
      # O Pages de um repositório é servido em <dono>.github.io/<nome>/, e
      # o build precisa saber esse caminho para montar os endereços dos
      # arquivos. Quando o repositório foi renomeado, o nome antigo continuou
      # escrito aqui: o GitHub redirecionou o endereço velho por um tempo, o
      # site pareceu funcionar, e quando o redirecionamento acabou a página
      # passou a responder "There isn't a GitHub Pages site here" — um erro
      # que não menciona renome nenhum e manda procurar no lugar errado.
      #
      # Derivando do próprio evento, um próximo renome se ajusta sozinho.
      REPO: ${{ github.event.repository.name }}
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build dos dois ambientes (cada um sob seu subcaminho)
        run: |
          npm ci
          # O Pages publica UM site por repositório, então os dois ambientes
          # dividem o mesmo endereço em pastas diferentes. Sai mais barato que
          # um segundo host e não precisa de conta nova:
          #
          #   teste       -> .../<repositório>/teste/
          #   homologação -> .../<repositório>/homologacao/
          #
          # Os dois são simétricos de propósito: cada um mora numa pasta com
          # nome próprio, e ninguém "mora na raiz". A raiz vira só uma placa
          # que aponta para o teste (passo seguinte).
          #
          # A trava do vite.config.ts vale para os dois: se um .env apontasse
          # para o Supabase de produção, aquele build não nasceria. Cada build
          # sai numa pasta separada para um não apagar o outro; a árvore final
          # é montada logo abaixo.
          npm run build:staging     -- --base="/$REPO/teste/"       --outDir=dist-teste
          npm run build:homologacao -- --base="/$REPO/homologacao/" --outDir=dist-homologacao
          rm -rf dist
          mkdir dist
          mv dist-teste       dist/teste
          mv dist-homologacao dist/homologacao

      - name: A raiz aponta para /teste/ e cada rota cai no app CERTO
        run: |
          # SPA em host estático: quem pede /teste/ferias direto recebe 404, e
          # o 404.html é que carrega o app. Com dois ambientes no mesmo site,
          # isso vira um risco: o Pages serve UM único 404.html (o da raiz) para
          # QUALQUER caminho inexistente do site inteiro. Ele carrega o app de
          # TESTE — assim um link fundo do teste, recarregado, abre a página
          # certa (o roteador do app usa o próprio subcaminho /teste/). Mas um
          # link fundo de HOMOLOGAÇÃO cairia no app de teste também, e a pessoa
          # acharia que olha um ambiente enquanto olha o outro. Confundir os
          # dois é o erro mais caro que este site pode causar.
          #
          # O desvio abaixo, injetado antes de qualquer bundle, manda os
          # caminhos de /homologacao/ para o app de homologação. Perde-se a
          # rota interna daquele link fundo (abre na entrada), o que é
          # preferível a abrir o ambiente errado.
          python3 - <<'PY'
          import io, os
          repo = os.environ['REPO']
          raiz_teste   = '/' + repo + '/teste/'
          base_homolog = '/' + repo + '/homologacao/'

          # 1) A RAIZ do site (.../<repo>/) redireciona para o teste, para que
          #    o endereço curto e qualquer link antigo continuem funcionando.
          idx = (
            '<!doctype html><html lang="pt-br"><head><meta charset="utf-8">'
            '<meta http-equiv="refresh" content="0; url=' + raiz_teste + '">'
            '<script>location.replace(' + repr(raiz_teste).replace("'", '"') + ');</script>'
            '<title>YourEyes — teste</title></head>'
            '<body>Redirecionando para o ambiente de teste…</body></html>'
          )
          io.open('dist/index.html', 'w', encoding='utf-8').write(idx)

          def injetar_no_head(html, script, nome):
              k = html.lower().find('<head>')
              if k == -1:
                  raise SystemExit(nome + ' sem <head> — script nao aplicado')
              k += len('<head>')
              return html[:k] + script + html[k:]

          # 2) O 404.html da raiz = app de TESTE + desvio para a homologacao.
          #
          # O desvio PRESERVA a rota (padrão spa-github-pages). Antes ele mandava
          # /homologacao/<rota> para a entrada /homologacao/ e a rota se perdia —
          # um deep-link de homologação (inclusive o /login que a suíte Cypress
          # visita) abria sempre na página inicial de marketing, sem formulário.
          # Agora ele reescreve /homologacao/<rota> para /homologacao/?/<rota>: a
          # rota viaja no query, e o decodificador do index.html da homologação
          # (passo 3) a restaura ANTES de o app montar. Assim o deep-link de
          # homologação passa a funcionar como o do teste (que já funciona porque
          # o 404.html da raiz É o app de teste).
          teste_html = io.open('dist/teste/index.html', encoding='utf-8').read()
          guarda = (
            '<script>(function(){var b=' + repr(base_homolog).replace("'", '"') + ';'
            'var l=location,p=l.pathname;'
            # O `!== b` evita laço: se a pasta da homologação faltar, o próprio
            # endereço de entrada cairia no 404 e se redirecionaria para sempre.
            'if(p.indexOf(b)===0&&p!==b){'
            'l.replace(b+"?/"+p.slice(b.length).replace(/&/g,"~and~")'
            '+(l.search?"&"+l.search.slice(1).replace(/&/g,"~and~"):"")+l.hash);'
            '}})();</script>'
          )
          io.open('dist/404.html', 'w', encoding='utf-8').write(
            injetar_no_head(teste_html, guarda, 'teste/index.html'))

          # 3) Decodificador da rota preservada, no index.html da HOMOLOGAÇÃO.
          #    Converte /homologacao/?/<rota> de volta para /homologacao/<rota>
          #    via replaceState, antes de qualquer bundle — o BrowserRouter da
          #    homologação (basename /<repo>/homologacao/) então enxerga a rota
          #    certa. Sem rota preservada (entrada normal), é no-op.
          decodificador = (
            '<script>(function(){var l=location;'
            'if(l.search&&l.search.charAt(1)==="/"){'
            'var q=l.search.slice(2).split("&");'
            'var rota=q[0].replace(/~and~/g,"&");'
            'var resto=q.slice(1).join("&").replace(/~and~/g,"&");'
            'history.replaceState(null,"",l.pathname+rota+(resto?"?"+resto:"")+l.hash);'
            '}})();</script>'
          )
          homolog_html = io.open('dist/homologacao/index.html', encoding='utf-8').read()
          homolog_html = injetar_no_head(homolog_html, decodificador, 'homologacao/index.html')
          io.open('dist/homologacao/index.html', 'w', encoding='utf-8').write(homolog_html)

          # 4) Fallbacks por pasta (defensivo; na prática o Pages usa o da raiz).
          io.open('dist/teste/404.html', 'w', encoding='utf-8').write(teste_html)
          io.open('dist/homologacao/404.html', 'w', encoding='utf-8').write(homolog_html)
          print('raiz->/teste/, 404.html (teste + desvio que preserva rota) e decodificador da homologacao criados')
          PY
          grep -q 'homologacao' dist/404.html   || { echo "::error::O desvio nao entrou no 404.html"; exit 1; }
          grep -q '/teste/'     dist/index.html || { echo "::error::A raiz nao redireciona para /teste/"; exit 1; }
          grep -q 'replaceState' dist/homologacao/index.html || { echo "::error::O decodificador de rota nao entrou no index.html da homologacao"; exit 1; }
          grep -q '?/' dist/404.html            || { echo "::error::O desvio da homologacao nao preserva a rota (falta o ?/ no 404.html)"; exit 1; }
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # ===================================================================
  # Testes de TELA (Cypress) contra o site de teste recém-publicado.
  #
  # Roda depois do site, então não atrasa nem bloqueia a publicação:
  # se quebrar, a esteira fica vermelha para avisar, mas o staging já
  # está no ar. O alvo é fixado aqui e conferido de novo pela trava do
  # cypress.config.ts — produção não é alcançável nem de propósito.
  #
  # A conta de teste tem valor padrão no cypress.config.ts, então o job
  # roda sem depender de secret. Os secrets abaixo, se existirem, têm
  # precedência — é assim que se troca a conta sem mexer no código.
  # ===================================================================
  telas:
    name: Testes de tela (Cypress) no staging
    needs: site
    runs-on: ubuntu-latest
    env:
      # CYPRESS_BASE_URL é derivado do dono/nome do repositório num passo abaixo
      # (não fixado aqui), para um próximo renome/troca de conta se ajustar sozinho.
      CYPRESS_EMAIL: ${{ secrets.CYPRESS_EMAIL }}
      CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}
      # Caminho de volta do resultado para o painel de QA. O token tem de
      # ser o mesmo nos dois lados: secret aqui e segredo QA_E2E_TOKEN na
      # Edge Function do staging. Faltando qualquer um dos dois, a suíte
      # roda igual e apenas não reporta — nunca quebra por causa disso.
      QA_E2E_URL: https://bmehdgthciuvdbvutsdv.supabase.co/functions/v1/qa-registrar-e2e
      QA_E2E_TOKEN: ${{ secrets.QA_E2E_TOKEN }}
      QA_E2E_ORIGEM: esteira staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Definir alvo do site de teste (deriva do dono/repo; sobrevive a renome)
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "CYPRESS_BASE_URL=https://$owner.github.io/${{ github.event.repository.name }}/teste/" >> "$GITHUB_ENV"
      - name: Cache do binário do Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar dependências
        run: npm ci
      - name: Guarda — teste de tela só existe se documentado (nível e2e)
        # Reprova a esteira se houver it() no Cypress sem caso documentado.
        # Sem QA_E2E_TOKEN, a guarda se pula sozinha (não bloqueia).
        env:
          QA_COBERTURA_URL: https://bmehdgthciuvdbvutsdv.supabase.co/functions/v1/qa-cobertura-e2e
          QA_E2E_TOKEN: ${{ secrets.QA_E2E_TOKEN }}
        run: npm run qa:cobertura-e2e
      - name: Esperar o site de teste responder
        # O deploy do Pages retorna antes do CDN servir a versão nova.
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "$CYPRESS_BASE_URL"; then
              echo "Site de teste no ar."; exit 0
            fi
            echo "Ainda não respondeu (tentativa $i); aguardando 15s..."
            sleep 15
          done
          echo "::error::Site de teste não respondeu a tempo."
          exit 1
      - name: Semear a conta-robô no staging
        # A suíte loga com uma conta fixa (padrão em cypress.config.ts). Se
        # ela não existir no banco de teste, o login falha e TODOS os specs
        # caem no beforeEach. Este passo garante a conta antes de rodar.
        # A função de seed já ficou de pé no job `banco` (functions deploy).
        env:
          SEED_URL: https://bmehdgthciuvdbvutsdv.supabase.co/functions/v1/seed-e2e-user
          QA_E2E_TOKEN: ${{ secrets.QA_E2E_TOKEN }}
        run: |
          if [ -z "$QA_E2E_TOKEN" ]; then
            echo "::warning::QA_E2E_TOKEN ausente — conta-robô não semeada. Se a suíte falhar no login, é isto."
            exit 0
          fi
          # Mesma conta que a suíte vai usar (mesmo fallback do cypress.config.ts).
          EMAIL="${CYPRESS_EMAIL:-teste@lucas.com}"
          SENHA="${CYPRESS_PASSWORD:-7654321}"
          # JSON montado por python (escapa certo, sem pegadinha de aspas de shell)
          # e enviado como arquivo binário — o corpo chega byte a byte à função.
          E="$EMAIL" S="$SENHA" python3 -c 'import json,os;open("/tmp/seed.json","w").write(json.dumps({"email":os.environ["E"],"senha":os.environ["S"]}))'
          echo "Corpo do seed: $(cat /tmp/seed.json)"
          CODE=$(curl -sS -o /tmp/seed.out -w "%{http_code}" -X POST "$SEED_URL" \
            -H "Content-Type: application/json" \
            -H "x-qa-token: $QA_E2E_TOKEN" \
            --data-binary @/tmp/seed.json)
          echo "Resposta do seed (HTTP $CODE): $(cat /tmp/seed.out)"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "::error::Falha ao semear a conta-robô (HTTP $CODE) — a suíte iria falhar no login."
            exit 1
          fi

      - name: Rodar a suíte
        run: npm run test:e2e
      - name: Guardar prints e vídeos da corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidencias
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7
